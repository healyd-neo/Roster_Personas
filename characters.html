<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap');
:root{--ink:#1a1a2e;--paper:#f8f4ef;--cream:#efe9de;--rule:#c9b99a;--red:#c0392b;--amber:#d4820a;--green:#1e6e3a;--blue:#1a4f8c;--purple:#6a0dad;--card:#fff;--shadow:0 2px 12px rgba(26,26,46,0.08);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh;}
.masthead{background:var(--ink);color:var(--paper);padding:1.5rem 3rem;border-bottom:4px solid var(--red);}
.mh-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.mh-left{}
.kicker{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--rule);margin-bottom:.3rem;}
.mh-title{font-family:'Playfair Display',serif;font-size:clamp(1.4rem,3vw,2.2rem);font-weight:700;color:var(--paper);}
.mh-sub{font-size:.82rem;color:var(--rule);margin-top:.2rem;}
.mh-stats{display:flex;gap:1.5rem;flex-wrap:wrap;}
.stat{text-align:center;}
.statnum{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;color:var(--paper);line-height:1;}
.statlabel{font-family:'DM Mono',monospace;font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;color:var(--rule);}
.back-link{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--rule);text-decoration:none;border:1px solid rgba(181,164,138,0.3);padding:.4rem .8rem;border-radius:3px;transition:all .15s;}
.back-link:hover{color:var(--paper);border-color:var(--paper);}
.controls{background:var(--cream);border-bottom:1px solid var(--rule);padding:.8rem 3rem;position:sticky;top:0;z-index:50;}
.ci{max-width:1400px;margin:0 auto;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;}
.sbox{flex:1;min-width:200px;display:flex;align-items:center;gap:.5rem;background:#fff;border:1px solid var(--rule);padding:.4rem .8rem;border-radius:4px;}
.sbox input{border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:.85rem;color:var(--ink);background:transparent;width:100%;}
.fg{display:flex;gap:.4rem;flex-wrap:wrap;}
.fb{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;padding:.3rem .7rem;border:1px solid var(--rule);background:#fff;color:var(--ink);cursor:pointer;border-radius:3px;transition:all .15s;}
.fb:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.fb.act{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.fb.act-r{background:var(--red);color:#fff;border-color:var(--red);}
.fb.act-a{background:var(--amber);color:#fff;border-color:var(--amber);}
.fb.act-g{background:var(--green);color:#fff;border-color:var(--green);}
.fb.act-b{background:var(--blue);color:#fff;border-color:var(--blue);}
.cnt{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--rule);margin-left:auto;white-space:nowrap;}
.main{max-width:1400px;margin:0 auto;padding:2rem 3rem 4rem;}
.sdiv{display:flex;align-items:center;gap:1rem;margin:2.5rem 0 1.2rem;}
.sdiv h2{font-family:'Playfair Display',serif;font-size:1rem;font-weight:400;font-style:italic;color:var(--rule);white-space:nowrap;}
.sdiv::after{content:'';flex:1;height:1px;background:var(--rule);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.1rem;}
.card{background:var(--card);border:1px solid #e8dece;border-radius:6px;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s,box-shadow .15s;cursor:pointer;position:relative;}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(26,26,46,.13);}
.card.hidden{display:none;}
.cstripe{height:4px;}
.sc{background:var(--blue);}.sr{background:var(--purple);}.sl{background:var(--amber);}
.cbody{padding:.9rem 1rem .8rem;}
.cscen{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:var(--rule);margin-bottom:.25rem;}
.cname{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--ink);line-height:1.2;margin-bottom:.12rem;}
.ctitle{font-size:.75rem;color:#666;margin-bottom:.6rem;font-style:italic;}
.ctags{display:flex;flex-wrap:wrap;gap:.25rem;margin-bottom:.7rem;}
.tag{font-family:'DM Mono',monospace;font-size:.55rem;letter-spacing:.08em;text-transform:uppercase;padding:.12rem .4rem;border-radius:2px;white-space:nowrap;}
.tr{background:#e8f0fc;color:var(--blue);}.tp{background:#f2e8fc;color:var(--purple);}.tl{background:#fef3e0;color:var(--amber);}
.tv-robust{background:#e8f5ee;color:var(--green);}.tv-stressed{background:#fff8e5;color:var(--amber);}.tv-breakdown{background:#fdecea;color:var(--red);}
.tpgy{background:#fafafa;color:#555;border:1px solid #e0e0e0;}
.cdesc{font-size:.8rem;line-height:1.5;color:#444;border-top:1px solid var(--cream);padding-top:.65rem;}
.cevent{margin-top:.45rem;padding:.35rem .55rem;border-radius:3px;font-size:.72rem;line-height:1.4;font-style:italic;}
.ev-red{background:#fdecea;color:#8b1a1a;border-left:2px solid var(--red);}
.ev-amber{background:#fff8e5;color:#7a4a00;border-left:2px solid var(--amber);}
.ev-green{background:#e8f5ee;color:#1a4a2a;border-left:2px solid var(--green);}
.sbadge{position:absolute;top:.6rem;right:.7rem;font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;color:#fff;padding:.18rem .4rem;border-radius:2px;text-transform:uppercase;}
.cpanel{display:none;padding:.75rem 1rem .9rem;background:#fafafa;border-top:1px solid #e8dece;}
.cpanel.open{display:block;}
.cps{margin-bottom:.8rem;}
.cps:last-child{margin-bottom:0;}
.cpl{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:var(--rule);margin-bottom:.25rem;}
.cpt{font-size:.8rem;line-height:1.55;color:#333;}
.expand-hint{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--rule);letter-spacing:.1em;text-transform:uppercase;margin-top:.45rem;opacity:.6;}
.nores{text-align:center;padding:4rem 2rem;font-family:'Playfair Display',serif;font-style:italic;color:var(--rule);font-size:1.2rem;display:none;}
.nores.vis{display:block;}
@media(max-width:700px){.masthead{padding:1rem 1.2rem;}.controls{padding:.6rem 1.2rem;}.main{padding:1rem 1.2rem 3rem;}.mh-stats{display:none;}}
</style>

<script>
const backstoryData = {
  "1": { leave: `10 days in late July — bringing her two young daughters (Aoibheann, 5, and Clíodhna, 3) to her parents' farmhouse in West Cork for the last weeks of the school holidays. Her husband Ciarán is a secondary school teacher and this is the only week both can take simultaneously.`, family: `Married to Ciarán, a secondary school teacher from Bantry. Two daughters. Her mother still farms 40 acres outside Skibbereen and the annual visit is non-negotiable.`, backstory: `Grew up speaking Irish on the farm before moving to Cork city for school. Studied medicine in UCC. She has been in neonatology since intern year — 'I walked into the NICU for the first time and never really left.' She is finishing her CCT this cycle and quietly hopes for a consultant post in Cork so she doesn't have to uproot the girls.` },
  "2": { leave: `10 days in mid-August — flying to Lagos for his younger brother Segun's traditional engagement ceremony. The whole extended family attends. He has been sending money home to help with the venue.`, family: `Parents both originally from Osun State, Nigeria; moved to Dublin when Ben was 7. Younger brother Segun is a software engineer. Ben is the first doctor in the family.`, backstory: `Grew up in Clondalkin. Was the kid who organised every school trip. Medicine was always the plan — his mother is a nurse and she quietly set the expectation early. He runs the department 5k team and coordinates the Christmas party. He is genuinely liked by everyone, which he uses shamelessly when he needs a swap covered.` },
  "3": { leave: `15 days split across August and October — August week for a Kraków trip to see her grandmother (90 this year, health declining), and October for a self-catering cottage in Connemara with her boyfriend Damian.`, family: `Born in Wrocław, moved to Dublin at 14 when her father got an engineering contract. Parents still live in Clontarf. Her grandmother in Kraków is her emotional north star.`, backstory: `Learned Irish alongside Polish and English growing up — still surprises people. She keeps a colour-coded study planner that other residents secretly photograph and copy. Her anxiety is worst before night shifts but she prepares so thoroughly that her performance never shows it.` },
  "4": { leave: `10 days in September — her own wedding anniversary trip to Lisbon with her husband Pádraic, who is a GP in Tuam. They have been trying to get away for three years and kept cancelling for various reasons.`, family: `Married to Pádraic Daly, GP. No children yet — a topic they've agreed not to discuss until she finishes training. Her parents are both teachers in Galway city.`, backstory: `From Salthill. Did her undergraduate in Galway, stayed for medicine, ended up in neonatology almost by accident and fell in love with it. She is the person you call at 3am because she picks up and she doesn't make you feel bad for it. She has never once said 'that's not my job.'` },
  "5": { leave: `15 days — first block in July (Donegal, fishing on Lough Derg with his father and uncle), second block in November (flying to New Zealand to visit his sister Aoife who emigrated in 2022).`, family: `From Donegal town. Father is a fisherman; uncle runs the same boat. Sister Aoife left for Auckland after her own training — it was supposed to be temporary.`, backstory: `One of eight children. Grew up in a house where medicine was seen as 'a solid option' rather than a calling. He came to neonatology through a difficult night shift as an intern — a 28-weeker he thought wouldn't make it, who did. He hasn't talked about that night with anyone. He simply never requested a different rotation after that.` },
  "6": { leave: `5 days in late September — attending Eid al-Mawlid celebrations with her extended family in Dakar (grandmother's 85th). She combines it with presenting a poster at a neonatal conference in Paris en route.`, family: `Father is Senegalese, mother Irish (from Limerick). Grew up bilingual in French and English, learned Irish at secondary school in Limerick. Has 12 cousins in Dakar she sees once a year.`, backstory: `She applied to medicine because she saw her cousin die of neonatal sepsis during a family visit aged 14. She has never said this out loud at work. She is the fastest learner anyone in the department has met in years — sitting all three MRCPCH components in the same window, which is technically possible but generally inadvisable.` },
  "7": { leave: `10 days in late August — Canary Islands with her partner Niamh and Niamh's parents, who have the apartment. It is the first proper holiday since her father's hip surgery last year.`, family: `Partner is Niamh, a physiotherapist at ULHG. Father had a hip replacement last year; Ciara managed most of his post-surgical care logistics. Mother works part-time at the Credit Union.`, backstory: `From Dooradoyle, Limerick. Did 14 months of maternity cover at her previous post — she says it was 'great for learning, terrible for sleep.' She is the resident most likely to have a snack in her pocket for the junior who hasn't eaten, and least likely to make a fuss about it.` },
  "8": { leave: `10 days in October — Prague, to attend his father's 60th birthday gathering. The whole Czech side of the family comes together; cousins from Brno and Ostrava. He is bringing his Irish girlfriend Siobhán for the first time.`, family: `Father is Czech, mother Irish (Cork). Grew up between Prague and Cork depending on where his father's engineering contracts were. Girlfriend Siobhán is a secondary school teacher.`, backstory: `He models his clinical practice on one specific consultant at Cork University Hospital who he shadowed during medical school. He carries the same pen that consultant gave him. He is punctual to a degree that other residents find slightly uncanny — he has never, in recorded history, been late.` },
  "9": { leave: `10 days in November — visiting her parents in Drumcondra (they moved from Lagos when she was 2) and attending her best friend Tara's baby shower in Wicklow.`, family: `Parents are Nigerian-Irish, both civil servants in Dublin. Older brother Femi is a pharmacist. She is the only doctor in the family.`, backstory: `Went to school in Artane, medicine in RCSI. She is the resident who still calls her consultant 'Professor' even in informal settings. She keeps a notebook of clinical questions she hasn't had time to look up yet — it has over 80 entries and she works through three every weekend.` },
  "10": { leave: `15 days — two weeks in July (Waterford, surfing at Tramore with his college friends, annual tradition since first year of medicine) and a few December days visiting his mother in Kilkenny.`, family: `Father is a solicitor in Waterford. Mother remarried and lives in Kilkenny. He has a half-sister, Clara (9), who adores him. He is a present but distracted older sibling.`, backstory: `He has a fellowship application in for a neonatal research post in Melbourne. He hasn't told anyone in the department yet. His clinical work is excellent; his paperwork is a disaster. He is charming enough that people forgive it — so far.` },
  "11": { leave: `No annual leave within the window. Takes a long weekend in November (blackout weekend) to visit her parents in Gothenburg — her father is unwell with early-stage Parkinson's and she goes monthly.`, family: `From Gothenburg. Parents both retired academics. Her brother Erik is a paediatrician in Stockholm. She came to Ireland for a one-year fellowship and stayed for six.`, backstory: `Her neurodevelopment PhD is on preterm brain injury outcomes — directly motivated by her brother's patient population. She is precise to the point of having a formula for everything, including how she makes her coffee.` },
  "12": { leave: `No significant annual leave requests in the window. Takes three days in October to attend his sister Máire's wedding in Killarney.`, family: `From Dingle. His family runs a small guesthouse. Three siblings, all in Kerry. His sister Máire is marrying a German cyclist she met on the Ring of Kerry route.`, backstory: `He chose metabolomics because he hated the idea of writing about things people already knew. He is the most laid-back person in the building — a quality the more anxious residents quietly orbit.` },
  "13": { leave: `No annual leave in the window. Blackout weekend includes July 19–20 — her younger sister's graduation ceremony at UCD.`, family: `Nigerian-Irish. Parents in Ennis, Co. Clare. Her father is a secondary school principal. Her sister is graduating with a degree in computer science.`, backstory: `She moved to Ennis at age 9. She is doing a PhD on neonatal nutrition outcomes in preterm infants — the research was inspired by a stillbirth she attended during a student elective in Lagos. She submits everything early and is slightly baffled by colleagues who don't.` },
  "14": { leave: `Standard leave distribution — no drama. Takes 10 days in September, Lanzarote with his wife Grainne and their infant son Senan (9 months). First proper family holiday since Senan arrived.`, family: `Married to Grainne, a speech and language therapist. New baby Senan. They live in a semi-detached house in Terenure.`, backstory: `PGY-4, almost at consultant stage. He has two job applications in and is quietly confident. He is the kind of senior resident who actually teaches juniors during ward rounds rather than just performing in front of them.` },
  "15": { leave: `15 days in July–August — front-loaded before her nights restriction. She and her partner Seán take a week in Sligo (where his parents have a house) and a week in Spain before the bump makes flying uncomfortable.`, family: `Partner is Seán Ó'Brien, a quantity surveyor. First pregnancy, unplanned but very much wanted. Her mother is a retired midwife, which has made every appointment so far both helpful and slightly too well-informed.`, backstory: `She found out she was pregnant at 14 weeks, just before the window started. She told the rota lead herself, promptly, with documentation from her obstetrician. She finds the nights restriction more frustrating than she expected — not because of the pregnancy, but because she actually likes nights. 'It's quieter. You can think.'` },
  "16": { leave: `12 days in October — flies to Chennai for his cousin's wedding. His grandmother is also unwell and he visits her during the same trip.`, family: `Parents moved from Chennai to Dublin when he was 3. Father is a cardiologist at Beaumont. There are expectations, gently expressed and frequently repeated, about Dev following in his father's footsteps. He chose neonatology partly as a loving act of independence.`, backstory: `He is careful to accommodate without becoming a doormat — agreeing to the nights swap with Aoife was a genuine decision, not a reflexive yes. He is the rare PGY-3 who pushes back on consultants when he has good reason.` },
  "17": { leave: `10 days in August — Lisbon with her college housemates from UCD, their annual trip that has survived marriages, jobs, and one very difficult breakup.`, family: `From Portlaoise. Parents run a hardware shop. Younger sister is studying veterinary. She was the only one in her school year to do medicine.`, backstory: `She is learning fast and is aware of it — you can almost see her processing clinical experiences in real time. She asks questions that are simultaneously obvious and penetrating. She will be excellent.` },
  "18": { leave: `No leave requests within the window. He took a long trip to Copenhagen in June and is content to work through. He is slightly incredulous at the drama generated by leave requests.`, family: `From Aarhus. His Danish wife Helene is a structural engineer working in Dublin. They have one cat named Bjørn.`, backstory: `He came to Ireland for a fellowship, liked the pace of Irish medicine (which he describes, with affection, as 'chaotic but warm'), and never quite left. He does not complain about nights. He regards complaining about nights as a form of weakness he is constitutionally unable to perform.` },
  "19": { leave: `12 days — week in Majorca with her partner (who is a nurse at the same hospital, which creates occasional awkwardness during annual leave clashes) and a few days at her parents' in Ennis for Fleadh Cheoil.`, family: `Partner is Dara, a neonatal nurse. Her father plays trad in a Fleadh band. She grew up in Ennis but has lived in Dublin since college.`, backstory: `She wanted to be a vet until she was 17. She does not mention this. She took charge during Robbie's absconding week with the efficient calm of someone who had been expecting something like this to happen.` },
  "20": { leave: `10 days in October — Bratislava for his parents' 30th wedding anniversary gathering. He hadn't been home in 18 months.`, family: `Parents and younger sister all in Bratislava. His mother video-calls every Sunday. He describes his relationship with Slovakia as 'loving and exhausting in equal measure.'`, backstory: `Came to Ireland on an Erasmus placement during medical school and stayed. His Slovak-Irish accent is a source of endless amusement to his colleagues. He covered Sunday night during Robbie's crisis and received TOIL Monday without complaint.` },
  "21": { leave: `10 days approved annual leave in August (Aug 11–22) — he said he was going to Ibiza. He went to his parents' house in Wicklow instead. He didn't tell anyone.`, family: `Parents in Greystones. His father recently retired after a difficult few years with alcohol. His mother holds the family together. Robbie is the eldest of three and carries more than his share of the family's weight.`, backstory: `He was a bright, engaged PGY-1. Something shifted in his second rotation — colleagues noticed but didn't know how to name it. The 'personal issues' on his file trace back to a bereavement that he processed alone: a close friend died of suicide during his intern year. He never told Occupational Health.` },
  "22": { leave: `10 days in November — Cairo to visit her parents, whom she hasn't seen since the previous Christmas. Her mother is unwell with a cardiac condition.`, family: `Parents in Cairo. Her father is a retired engineer; her mother a former schoolteacher now managing heart failure. Layla is the middle child of three — both siblings also in medicine.`, backstory: `Came to Ireland for postgraduate training after Cairo University. She plans to return to Egypt eventually but 'eventually' has been moving further away each year. She is the calm one in emergencies — a stillness that her registrar once described as 'almost eerie.'` },
  "23": { leave: `8 days in September — Chennai for a family function (her uncle's 70th birthday) and to see her parents.`, family: `Parents in Chennai; father is an orthopaedic surgeon. She grew up in an atmosphere where clinical excellence was assumed, not praised. She is in Ireland because her mother insisted she train internationally.`, backstory: `She was the one who volunteered to cover Thursday night during Robbie's crisis without being asked. Not because she had nothing better to do — she had a study leave paper to finish. She finished it on Friday instead.` },
  "24": { leave: `No annual leave in the window. His RF contract doesn't include significant AL. He attends a metabolomics conference in Edinburgh in October — 2 days, study leave category.`, family: `Parents in Glasnevin — his father immigrated from Seoul in the 1990s, mother is Irish. He grew up in a bilingual house, though his Korean is now 'tourist level at best.'`, backstory: `He covered Tuesday night goodwill during Robbie's crisis. He then clearly explained that he couldn't cover consecutive nights because his research commitments would suffer — and this was respected. He is studying pancreatic biomarkers in extremely preterm infants.` },
  "25": { leave: `Had 10 days approved for August (Aug 10–21) — Tuscany with her husband Ciarán for their 5th wedding anniversary. She was hospitalised instead. She takes 5 days in December on her return.`, family: `Husband Ciarán is an architect. No children yet. Her illness has prompted conversations about timelines she had been deferring.`, backstory: `She called in with chest pain on a Monday morning. She thought it was a pulled muscle from a weekend run. It was not. Viral myocarditis. She spent the first week in hospital thinking about all the things she hadn't said to people. She came back to work changed in a way she is still identifying.` },
  "26": { leave: `Deferred 5 days voluntarily until October, when the locum is settled. Takes them as a week in Amsterdam with her sister Shirin.`, family: `Parents came from Tehran in the 1990s. Father is a GP in Lucan. Older sister Shirin is a barrister. They are close in the way siblings are when they've navigated immigration together.`, backstory: `She stepped into Áine's informal leadership role immediately and without fanfare. She has been doing this her entire career — filling gaps that others leave without ever naming it. When the peer support check-in was arranged in Week 10, she told the consultant, with complete calm, that she was fine. She wasn't entirely, but she knew where the line was.` },
  "27": { leave: `Deferred 5 days voluntarily until November. Takes them visiting his cousin in London.`, family: `Parents in Accra. He comes to Dublin annually at Christmas. His mother calls weekly; his father sends voice notes.`, backstory: `He became the most senior effective resident after Áine's admission and did it without asking for recognition. He deferred his own leave without being asked. He will be an excellent consultant — he has that quality of making people feel more competent in his presence.` },
  "28": { leave: `No annual leave in locum contract. He negotiated 3 personal days as part of the locum agreement.`, family: `Parents in Dublin's Ghanaian community. He has been locuming for two years since completing his CCT — building savings for a house deposit.`, backstory: `He arrived cautious — locums often do, when the context is unfamiliar. Parisa briefed him informally in Week 7. By Week 9 he was asking clinical questions in ward rounds that nobody had thought to ask. He was demobilised at Week 14 with a letter of commendation.` },
  "29": { leave: `No annual leave in RF contract. Two nights goodwill in Week 6.`, family: `From Lyon. His partner Elise is a UX designer working remotely. They are enjoying Dublin more than they expected to.`, backstory: `His PhD is on organised neural activity in preterm infants at risk of cerebral palsy. He is methodical to the point of writing daily research logs in a bound notebook rather than digitally. He covered 2 nights goodwill and regarded it as 'a normal thing to do.' This perspective is not shared by everyone.` },
  "30": { leave: `Wanted Aug 17–Sep 5 (15 days) — Modena for his grandmother Rosaria's 90th birthday, the last time the whole family would likely gather. He booked Ryanair flights before getting approval. He has never forgiven himself for this lapse in procedure.`, family: `Parents moved from Modena to Dublin when he was 11. His grandmother Rosaria is the family's gravitational centre. He has 9 cousins in Italy, all of whom are louder than him.`, backstory: `He submitted a formal complaint about the leave redistribution and is still, years later, slightly embarrassed by it. He did eventually get to Italy for 3 days in October via compassionate leave. He saw his grandmother. She died in February.` },
  "31": { leave: `Jul 28–Aug 15 (15 days) — Greece, the south of Crete, with her boyfriend who works in fintech and 'actually has money for holidays.' Template slot aligned; she got priority.`, family: `From Carlow. Parents both retired. Boyfriend works in Dublin fintech. They have been together three years and she is beginning to wonder if he's going to propose at some point.`, backstory: `She is nearly consultant-level and knows it. She pushed for July–August because 'I've earned a good summer.' She was right by the matrix. She handled the priority decision without gloating, which is more than could be said for some.` },
  "32": { leave: `Aug 3–14 (10 days) — Connemara first, then a week at a festival in Electric Picnic (her partner is one of the stage managers).`, family: `Partner is Colm, who manages logistics at Electric Picnic. They have a golden retriever named Séamus who stays with her parents in Galway.`, backstory: `The only PGY-4 who actively enjoys the chaos. She has accepted a consultant post in Galway starting in January and is in her last stretch of training. She is relaxed about it in a way that makes juniors envious and consultants quietly fond.` },
  "33": { leave: `Aug 3–7 and Sep 7–11 (10 days total) — first block is Helsinki to see her father who she hadn't seen in two years; second block is a week in a rented cottage in Kerry with her Irish girlfriend.`, family: `Father in Helsinki (estranged for several years, now in cautious repair). Irish girlfriend Sinéad is a secondary school science teacher.`, backstory: `She moved to Ireland aged 25 for a fellowship and never went back. Her Finnish-Irish accent is something people make requests to hear. She keeps her two lives (clinical work and personal life) very separate — not secretively, but cleanly.` },
  "34": { leave: `10 days in August — Dingle Peninsula, solo walking holiday. He does this every year. He does not invite people to join him.`, family: `Unmarried. Parents in Sandycove. His father is a retired judge; his mother a retired barrister. He grew up in a house where formality was not affectation — it was the default.`, backstory: `He is not, technically, wrong about very much. The problem is that he is correct in a way that makes people want to be incorrect just to spite him. He grew up watching his father run a courtroom and absorbed the lesson that procedure protects everyone — but missed the lesson that procedure serves people, not the other way around.` },
  "35": { leave: `10 days in September — Lisbon with his partner and two college friends. Annual tradition. He submitted the right forms at the right time.`, family: `Partner is Emma, a nurse at a different hospital (which helps with shift patterns). They have a 2-year-old daughter named Méabh.`, backstory: `He and Declan had a documented verbal argument in Week 2 over a handover that both parties believe the other mishandled. Neither of them are entirely wrong. The argument was the kind that happens when two people who are both right about different things refuse to acknowledge the other's point.` },
  "36": { leave: `10 days in October — Warsaw for his parents' anniversary and to attend a Polish medical conference.`, family: `Parents in Warsaw. Came to Ireland as part of a medical exchange programme and stayed. Has a younger sister studying pharmacy in Kraków.`, backstory: `He would argue that he is simply protecting the integrity of the rota by insisting on formal documentation. He is not wrong, but he has mistimed this principle — applying it in a way that requires 45 minutes of negotiation to achieve what should take 5 minutes. He will be a very good doctor in a system that values process. He is in the right profession.` },
  "37": { leave: `10 days in July (Lagos — her parents' 35th wedding anniversary gathering). She exhausted herself covering for others in the months before the window started.`, family: `Parents in Lagos. Older brother Tobi is in London finance. She is the only sibling in medicine. Her parents are proud in a way that manifests as daily WhatsApp check-ins.`, backstory: `She is considering requesting a transfer and has not told anyone. She went into neonatology because she wanted to help babies survive. She did not expect to spend so much energy managing the egos of people who should know better. Her two days of viral illness in Week 5 were genuine. The timing was also a relief.` },
  "38": { leave: `8 days in August — Beijing to see her parents (first time in 18 months). She has not told them how she is finding this rotation.`, family: `Parents in Beijing. Father is a retired professor of mathematics; mother runs a small language school. Mei grew up with the expectation that she would excel at whatever she chose. She chose medicine and has been excelling at it without joy for about six months.`, backstory: `She tried to stay neutral between the two cliques and was consumed by it. The peacekeeper always absorbs the most damage. By Week 16 she had been fielding passive-aggressive emails, mediating break room arguments she didn't start, and working full shifts without eating lunch. The occupational health referral came after she sat in a supply cupboard for 20 minutes to avoid crying in front of a patient.` },
  "39": { leave: `10 days in August — Sardinia with her partner Oisín.`, family: `Partner Oisín is a civil engineer. They live together in Ranelagh. She has two older brothers, both in finance.`, backstory: `The incomplete handover she sent to Claire was not malicious. It was rushed. She was angry at Declan about a different matter and wasn't paying enough attention. She knows this. The near-miss report was the worst day of her career and she has not made that mistake again.` },
  "40": { leave: `No annual leave approved in the window — he joined mid-rotation and is still establishing his entitlement timing.`, family: `Parents in Accra; he came to Dublin for his PMETB assessment route. Younger brother is studying in the Netherlands. He lives alone in a flat in Drumcondra.`, backstory: `He is intimidated by the department dynamic in a way that feels disproportionate to his clinical ability. He is, by objective measures, a good PGY-2. He texts his mother about patients he worries about — coded, anonymised, because he needs to process things somewhere. She always responds with a Bible verse. He finds this annoying and comforting in equal measure.` },
  "41": { leave: `5 days in October — home to the Aran Islands for her cousin's wedding.`, family: `From Inis Mór. Her first language is Irish; English is still slightly foreign-feeling in her head. Her father fishes; her mother teaches at the island school.`, backstory: `She is the first person from her island to do medicine. This is a fact she finds both meaningful and heavy. She watches the dynamic in the department with the careful attention of someone who has always had to read rooms correctly because she couldn't afford to get it wrong.` },
  "42": { leave: `No annual leave in window.`, family: `From Cork city. Parents both retired teachers. Girlfriend is a GP trainee at a different hospital.`, backstory: `He tried to bridge the cliques with lunches, corridor conversations, and what he describes as 'aggressive friendliness.' By Week 10 he concluded that some interpersonal problems are structural, not social, and the best thing he could do was keep his own head down and his own work clean.` },
  "43": { leave: `10 days in July (Gaeltacht area, Connemara — family tradition going back 30 years; her grandparents still live there). Not sitting any exam this window.`, family: `From the Connemara Gaeltacht. Irish is her first language. Her grandparents still farm the land where she spent every summer. Her father is a secondary school principal in Galway.`, backstory: `She is the only senior resident not sitting an exam this window, which she describes as 'deliberate and magnificent.' She absorbs the extra load during October and November with the equanimity of someone who simply decided not to be stressed about it. She receives a commendation letter and first-priority leave for the next window. She uses the priority leave to take her grandmother to Lourdes.` },
  "44": { leave: `5 days in September — Lanzarote with her college friends. Her first proper holiday since starting postgraduate training.`, family: `From Castlebar. Parents run a bed and breakfast. Younger brother Cillian is doing his Leaving Cert.`, backstory: `She is a PGY-2 who covers extended Long shifts during the exam season with a focused competence that surprises people who assumed she'd need hand-holding. She passed her own MRCPCH Part 1 in June (before the window started) and is quietly preparing for Part 2A.` },
  "45": { leave: `Study leave Nov 4–5 (prep + exam). No annual leave in window — saving it all for Christmas.`, family: `Parents in Dundrum. Father is an accountant; mother a pharmacist. He is the youngest of four, all in healthcare.`, backstory: `He was annoyed when his prep day was moved from Nov 6 to Nov 4. He told the rota lead this, directly. The rota lead explained the capacity constraint clearly. He accepted it, sat the exam, and passed. He texted the rota lead 'cheers — and fair enough' the following Monday.` },
  "46": { leave: `No annual leave in window.`, family: `Nigerian-Irish. Parents in Finglas. Her father is a bus driver; her mother a community healthcare worker.`, backstory: `She covered nights on Nov 5 as the last piece in the cover jigsaw — pre-arranged in Week 14 at the rota lead's request. She said yes immediately, before being told what it was for. That is the kind of person she is.` },
  "47": { leave: `12 days — August in Portugal (family holiday with her husband Ciarán and their 4-year-old twins Luca and Ailbhe). The twins are why she chose neonatology. She doesn't say this to patients.`, family: `Married to Ciarán, a secondary school PE teacher. Twins Luca and Ailbhe (4). Her parents live 10 minutes from the hospital, which helps enormously with childcare.`, backstory: `She has been asked to swap or extend 3 times by Week 12. She has said yes three times and will say yes again if needed. She gets a 1:1 acknowledgment from the rota lead and first-choice shift in the final 4 weeks. She uses the shift priority to swap herself onto a short day on her twins' school play day.` },
  "48": { leave: `10 days in August — Clare Island with his family. His father brings the same 4-man tent every year and each year it is in slightly worse condition.`, family: `From Westport. Father is a secondary school teacher. Mother is a community nurse. The tent is a family institution.`, backstory: `He is correctly deployed to OPD standard only when Tara is sick with Covid — someone checked his competency level and made the right call. He is developing well. The Week 11 supervision decision is formally documented not as a criticism of Pádraig, but as a standard.` },
  "49": { leave: `10 days in October — Barcelona with her partner Ciaran.`, family: `Partner Ciaran is an architect. They met at a mutual friend's wedding. They have a cat named Biscuit.`, backstory: `She covered Wednesday and Thursday nights during Ivan's back pain absence with competence and zero drama. She received TOIL and spent it having a very long lie-in, which she described as 'the best medical intervention I've received this year.'` },
  "50": { leave: `8 days in September — home to Connemara to see his family and decompress.`, family: `From Carna in Connemara. Irish is his first language. His mother is a nurse; his father runs a B&B. He is the youngest of five.`, backstory: `His stress and anxiety built quietly across Weeks 12–15. He is carrying financial worry (student loans, rent in Dublin) on top of a rotation that is demanding more than he expected. His sick leave in Week 16 was the first time he had ever called in sick in his career. He accepted the OH check-in with relief.` },
  "51": { leave: `No annual leave in window.`, family: `From Gothenburg. Partner Lars (no relation to Dr. Lars Andersen in Scenario 2) is a chef. They have a newborn daughter named Astrid.`, backstory: `She covered 2 nights goodwill during Ivan's Week 7 absence. Her daughter Astrid was 6 weeks old at the time. She did not mention this to the rota lead when agreeing to cover. She mentioned it afterward, not as a complaint, but as something she thought was worth knowing.` },
  "52": { leave: `No annual leave in window. Takes 3 days in November (Sofia, Bulgaria — her father's 65th birthday).`, family: `From Sofia. Father is a retired surgeon. Mother is a retired teacher. She came to Ireland for a fellowship on preterm gut microbiome and stayed. Her partner is a data scientist from Cork.`, backstory: `She is the sole RF from Week 9 onward. She was asked directly what she was willing to do above her obligation, and she gave a direct answer: she would cover one extra weekend but not two. That boundary was respected. She was offered the same commendation letter the dream team RFs received, and she accepted it with a quiet 'thank you' and got back to her bench.` },
  "53": { leave: `Leaves Week 6 — family emergency in Seville (his mother suffered a stroke). Non-negotiable.`, family: `From Seville. Mother is 72 and had been widowed the previous year. He is the eldest of three children; his siblings are both in Seville.`, backstory: `He was a good RF — organised, easy to work with, never missed a blackout date submission. He left with 2 days' notice, as quietly as he arrived. His mother recovered. He sent a card from Spain that arrived after the window closed.` },
  "54": { leave: `Three consecutive no-shows without communication.`, family: `Unknown. She never disclosed personal information to colleagues.`, backstory: `Nobody knew what was happening. She missed her first shift without calling in. Then her second. By the third, her emergency contact had been attempted without success. HR initiated the formal process. Her contract was terminated. She was never heard from again within the department. There is a rumour she went travelling. Nobody knows for certain.` },
  "55": { leave: `10 days in August — Lagos for her grandmother's funeral. She had already booked tickets for what was supposed to be a birthday visit.`, family: `Parents in Lagos. Grandmother was 91. Four aunts and uncles. She is the only one of her immediate family in Ireland.`, backstory: `She covered Oct 10 weekend as overtime pay. When the rota lead explained the situation and asked if she'd be willing, she said: 'Of course. Just make sure the paperwork is right.' The paperwork was right.` },
  "56": { leave: `10 days in September — Warsaw and Kraków. He always combines visiting his parents in Warsaw with a few days in Kraków, where he has friends from medical school.`, family: `Parents in Warsaw. Father is an engineer. Mother is a secondary school biology teacher. He has a younger sister, Kasia, in medical school in Lublin.`, backstory: `He covered Oct 11 Sunday weekend as overtime pay. He regarded it as 'a clean arrangement.' He was right.` },
  "57": { leave: `Requested 22 days. Was approved 15 (Jul 14–25 for golf trip to Portugal with college friends, Oct 5–9 for Munster vs Leinster in Dublin, Dec 15–16 for his mother's birthday in Killarney).`, family: `Parents in Killarney. Father is a solicitor; mother a retired bank manager. He is the third generation of his family to play golf at Killarney Golf and Fishing Club.`, backstory: `He has never not gotten what he wanted, professionally or personally, until now. The clinical director upheld the 15-day limit with evident patience. Rián was visibly difficult for three weeks. By Week 6 he was clinical functioning fine and filing his grievance internally rather than externally. He will be an effective consultant who sometimes forgets that effectiveness isn't the same as entitlement.` },
  "58": { leave: `Requested 17 AL days + 18 SL. Got 13 AL (conference in London, MRCPCH exam, and some annual leave) + 4 SL (exam + prep + 2 conference days). Used every approved day with a precision that suggested the excess requests were strategic.`, family: `Parents in Lagos. Older sister is a consultant physician in London. The comparison is never spoken but always present.`, backstory: `She is not a bad person. She is a very determined person who learned early that asking for more than you need and negotiating down is more effective than asking for exactly what you need. She is correct. The rota lead didn't find this charming.` },
  "59": { leave: `15 days — wanted all in August (Tenerife with a group of seven friends from UCD, annual reunion trip). Got 10 in August and 5 in October. Sulked.`, family: `From Dundalk. Parents still in Dundalk. Younger brother is a nurse in Australia.`, backstory: `The Tenerife trip did happen — 10 days of it. She missed the last weekend of the group holiday. She has not quite forgiven the rota for this, even though the rota was correct. She is a good clinician. She is not, in this window, a gracious team member.` },
  "60": { leave: `15 days — 2 weeks in Sweden (Midsommar with family; non-negotiable cultural event) and 2 isolated single days (Sep 17 for a dentist appointment he can't reschedule; Nov 20 for his partner's job interview in London that he wants to attend).`, family: `Swedish-Irish. Partner Orla is a graphic designer who was shortlisted for a creative director position in London. They are trying to figure out what that means for them.`, backstory: `His EU EWTD argument was incorrect in context and he knows it. He made it anyway because he was frustrated. The Sep 17 day was approved. The Nov 20 day was moved to Nov 13. He attended the London interview by taking a Tuesday off instead of a Friday. Orla got the job. They are now having a different conversation.` },
  "61": { leave: `12 days in August — Abuja, Nigeria, for her parents' 40th wedding anniversary gathering. She submitted the correct forms in the correct format with the correct supporting documentation in Week 1.`, family: `Parents in Abuja. Father is a retired civil servant; mother runs a catering business. She is the eldest of four. All four are in healthcare.`, backstory: `She is frustrated by her colleagues in a way she expresses only to her husband in Lagos via WhatsApp. To everyone else, she is professional, pleasant, and completely unreadable. She will be a consultant before anyone in this window and she knows it.` },
  "62": { leave: `No annual leave in window.`, family: `From Darwin, Australia. Aboriginal Australian and Irish heritage (her Irish grandmother moved to Australia in the 1960s). Partner is an Irish engineer working in Dublin.`, backstory: `She covered two goodwill nights on Nov 18–19 — the hardest nights in the viral surge scenario. She was pre-briefed the week before and said yes without ceremony. She received a formal letter of thanks from the clinical director. She pinned it to her lab notice board, slightly embarrassed, then left it there.` },
  "63": { leave: `Conference study leave Nov 3–6 (completed before the wave). Annual leave 10 days in September — Stockholm to see her family.`, family: `From Malmö. Parents and older brother in Sweden. She came to Ireland for a neonatal research fellowship and met her husband Declan, a Dublin solicitor, in a queue at a coffee shop in Year 1.`, backstory: `She extended her NICU standard to a Long shift on Nov 18 voluntarily, covering Orla's absence during the viral surge. She did this after already having a full day on shift. She is PGY-4 and has seen enough difficult weeks to know that this is what you do.` },
  "64": { leave: `Annual leave Nov 10–12 (her annual leave block that was always going to be there — she approved it in Week 1). Returns from leave to find her colleagues in the middle of a viral wave.`, family: `From Athlone. Husband Eoin is a pharmacist. They have a 6-year-old daughter Aoife who is 'at the age where she asks impossible questions and expects proper answers.'`, backstory: `She came back from annual leave on Nov 13 and immediately covered a PNW shift from her REST day on Nov 18. She didn't ask for TOIL first. She asked what was needed and then asked about TOIL. She received it.` },
  "65": { leave: `No annual leave in window. His Block B weekend (Nov 14–15) was already completed.`, family: `From Galway city. Parents are both GPs. His becoming a researcher was a gentle act of rebellion.`, backstory: `He got norovirus on Nov 18. He reported it to infection control before telling the rota lead. He was excluded for 48 hours and recovered fully. He found being on the patient side of the exclusion protocol instructive.` },
  "66": { leave: `Had 12 days approved in July–August — Connemara with her family. This was the last holiday she had before the burnout.`, family: `Parents in Castlebar. She has been living alone in a studio flat in Dublin for 3 years. She describes this as 'fine' to everyone who asks.`, backstory: `She had been sleeping 4 hours a night and losing weight for six weeks before the panic attack. The colleagues who noticed said something. The ones who didn't are still wondering if they should have. Her occupational health referral was the best outcome for everyone. She came back quieter, more boundaried, and arguably more present.` },
  "67": { leave: `12 days approved in October. Did not take them — 'too much to do.'`, family: `Parents in Lagos; he grew up in Clontarf from age 10. Father is an engineer; mother is a lecturer. His older brother Tobi is a consultant surgeon in London. The comparison is never spoken.`, backstory: `He refused to engage with occupational health until it became a condition of continued practice. He still believes, privately, that he would have been fine if he'd just pushed through. He is wrong. The documentation errors he was making are the kind that, in a different context, harm patients. He has not yet fully accepted this.` },
  "68": { leave: `10 days in August — Warsaw, family visit. Her grandmother is 94 and still makes pierogi.`, family: `Parents in Warsaw. Came to Dublin for a fellowship in 2021 and stayed when she met her Irish partner, Seán, a data scientist.`, backstory: `She covered one of Caoimhe's nights by swapping her Tuesday Long. She got TOIL Friday. She spent TOIL Friday having coffee with Caoimhe, who was by then home recovering. They became friends. This is not in the management report but it is the most important thing that happened.` },
  "69": { leave: `10 days in September — Lagos for her father's retirement party.`, family: `Parents in Lagos. Her father just retired from a 30-year career in banking. She is the eldest of three and the only one in medicine.`, backstory: `She covered the 4th night voluntarily during Caoimhe's absence. She was asked. She said yes. She then said: 'I'm going to need the compensatory rest day in writing before the weekend.' It was in writing by the end of the day. She is an excellent clinician who knows the difference between generosity and naivety.` },
  "70": { leave: `8 days in August — home to Tralee and a week of doing very little.`, family: `From Tralee. Parents run a hardware shop. Two older brothers, both in trades. She is the first in the family in medicine and the achievement is celebrated at every family occasion, which she finds both warming and mildly exhausting.`, backstory: `She covered Femi's PNW Long shift under Eamonn's supervision in Week 16. She was PGY-2 covering a PGY-3 slot with appropriate safeguards in place. She did it competently. Nobody makes a fuss of it. She makes a quiet note of it in her own portfolio.` },
  "71": { leave: `11 days as a block (Aug 11–21) in Tunisia — her hometown of Sousse. Plus 4 single-day cultural observances across the window.`, family: `Father is a professor of economics in Tunis; mother a retired schoolteacher in Sousse. She has a younger brother, Karim, who is also a doctor. Her grandmother in Sousse is 88 and in good health.`, backstory: `She prefers single-day leave for religious and cultural observances because that is how she has always navigated institutional life in North Africa and Europe — small, targeted absences rather than long blocks. The pragmatic policy decision to allow this as an exception is one of the better management decisions of the scenario.` },
  "72": { leave: `10 days in October — Wrocław for his parents' anniversary and to see medical school friends.`, family: `Parents in Wrocław. Father is a civil engineer; mother a pharmacist. He has an older sister in Germany.`, backstory: `He arrived in Week 1 with his IMC registration still pending. He told the rota lead immediately and proactively. Anna from P7 helped him navigate the system. By Week 3, credentials confirmed. By Week 8 he was one of the most dependable residents on the floor. He is, as the saying goes, worth the wait.` },
  "73": { leave: `8 days in November — Seoul, Korea, for her parents' 30th wedding anniversary.`, family: `Parents in Seoul. Father is a civil engineer; mother is a secondary school maths teacher. She grew up with the expectation of precision.`, backstory: `She does not raise concerns verbally. This is not stubbornness — it is how she learned to communicate in a culture where written precision is valued over spoken improvisation. The handover protocol implemented for her is framed correctly (as accommodation) and she accepts it with visible relief. By Week 8 she is using it naturally.` },
  "74": { leave: `10 days in October — Tehran for his cousin's wedding. He has not been back in 18 months.`, family: `Parents in Tehran. Father is a cardiologist; mother a retired architect. He came to Ireland via a UK training programme and chose Dublin for the neonatal fellowship.`, backstory: `The Friday prayer arrangement requires 5 micro-swaps across the window. Adenike covers his Friday afternoons; he reciprocates on her study leave days. Both document it formally. Both regard it as entirely normal. The rota lead agrees.` },
  "75": { leave: `10 days in September — Gdańsk for her 10th medical school reunion.`, family: `Parents in Gdańsk. Her father is a retired naval officer. She has been in Ireland since 2019 and is considering permanent settlement.`, backstory: `She helped Piotr navigate the system in Week 1 because she remembered how disorienting it was when she arrived. Her REST day disruption for Piotr's supervised nights was accepted without complaint. She is the kind of colleague people remember warmly years later.` },
  "76": { leave: `10 days in December — Dakar, Senegal, for the Christmas period.`, family: `Father Senegalese, mother Irish (from Limerick). She grew up switching between both cultures fluently.`, backstory: `She acts as informal cultural liaison during the orientation week for international residents — not as a formal role, just as herself. She is good at this. She bridges without mediating, which is a rarer skill.` },
  "77": { leave: `Had 10 days approved in October. Never taken — hospitalised following the RTA in Week 11.`, family: `From Sligo. Parents still in Sligo. His girlfriend Aoife is a nurse at the same hospital — she was in the departing group when the taxi crashed.`, backstory: `He and Bola shared a taxi home from the departmental social event. The taxi driver ran a red light. Ciaran had a fractured collarbone and a mild concussion. He spent the first week in hospital making lists of things he needed to sort. The second week he stopped making lists.` },
  "78": { leave: `Had 10 days approved in August (Lagos — family visit). Taken. October leave never used.`, family: `From Lagos, grew up in Lucan. Parents in Lucan. Father is a software engineer at a tech firm; mother is a secondary school vice principal.`, backstory: `He was in the same taxi as Ciaran. Back injury — L4/L5 strain. He is told he will be fine but it will take time. He returns to work in Week 14, days only, no nights. He is quieter after the accident. Emre covers his nights in Week 16 without complaint.` },
  "79": { leave: `12 days in September — road trip through the west of Ireland with her sister, a tradition going back to their father's death in 2019.`, family: `From Cork. Older sister Clíona lives in Galway. Annual September road trip replaces a family holiday they used to do when their father was alive.`, backstory: `She was the one who had a cover plan drafted by 11am on the morning both residents were hospitalised. She has been in situations like this before — not identical, but similar. She knows that having a plan, even an imperfect one, is better than perfect silence.` },
  "80": { leave: `12 days in August — Lagos for his nephew's naming ceremony.`, family: `Parents in Lagos. Older sister and her husband are in Dublin; his nephew was named Emeka (after the grandmother's suggestion). He is deeply fond of the baby.`, backstory: `He covered Tuesday NICU Long from REST on the first day of the RTA crisis. He also served as informal Flex in Week 15 when the actual Flex slot was absent. He was named explicitly in the management review for commendation. He said: 'Let's just sort the locum out faster next time.'` },
  "81": { leave: `10 days in October — Almaty, Kazakhstan, for her parents' 35th anniversary.`, family: `From Almaty. Parents there. She came to Ireland via a UK training programme. She makes very good borscht and periodically brings it to the department.`, backstory: `She extended from standard to Long on 3 of 5 days during Ciaran's Week 13 absence. This is a significant extra physical and cognitive load. She received formal recognition and TOIL. She used the TOIL to sleep for 11 hours.` },
  "82": { leave: `No annual leave in window.`, family: `From Limerick. Parents still there. Girlfriend Sorcha is a postdoctoral researcher at UCD.`, backstory: `He used 4 goodwill shifts in the RTA scenario — more than any other RF in any 2-RF scenario. He was formally notified of his remaining balance (1 shift) and told that no further use would be assumed. He responded: 'Good. I was going to say the same thing.'` },
  "83": { leave: `10 days compassionate leave (Sep 14–25) — Lagos for his father's funeral and burial rites. His father, Emmanuel, was a retired civil engineer who had moved back to Imo State after decades in Dublin.`, family: `Father Emmanuel died suddenly of a cardiac event. Mother Ngozi still in Dublin (Ongar). Younger sister studying nursing. His father was the first person who told him he would be a doctor.`, backstory: `He came back on Sep 28. He was functional but not himself — he knew it, his colleagues knew it. The team rallied. Aleksei had already offered his nights before being asked. Niamh had cooked food for his apartment. These are the things that don't appear in management reports.` },
  "84": { leave: `10 days in August — Dingle, family house. Her grandmother Mary was 87 and still making brown bread.`, family: `Grandmother Mary dies in Week 3. She was the family's anchor — the one who remembered every birthday, who called every Sunday.`, backstory: `Three days compassionate leave. She was back Thursday. She has not cried yet — she keeps planning to and then a patient needs her. This is both a coping mechanism and a problem she will address at Christmas.` },
  "85": { leave: `10 days in August — Cork, visiting parents. Nothing dramatic.`, family: `From Douglas, Cork. Parents still there. Her dog Biscuit died on Aug 7 at the age of 14. He was the dog she grew up with.`, backstory: `She called in saying she was unwell. The rota lead suspected the real reason but did not press. The call was coded as uncertified sick leave. No spectacle was made. She returned the next day and worked well. She texted the rota lead a week later: 'Thank you for how you handled that.' The rota lead replied: 'I hope you're doing okay.'` },
  "86": { leave: `10 days in September — Moscow to see his parents. He hasn't been back since before the war. The family situation is complicated. He does not discuss it at work.`, family: `Parents in Moscow. The situation in Russia makes visits logistically and emotionally difficult. He came to Ireland in 2021 and has applied for a visa extension.`, backstory: `He volunteered 2 nights during Emeka's bereavement absence before the rota lead asked. He did this because it was the right thing to do and he knew it. He received TOIL and used it to attend a Russian Orthodox church service in Dublin — something he does rarely and privately.` },
  "87": { leave: `10 days in October — Lagos for her parents' anniversary.`, family: `Parents in Lagos. Her cousin Adaeze (28) was expecting a baby in November. The baby was stillborn at 36 weeks. Yewande was granted 2 days compassionate leave.`, backstory: `The support offered to her — a check-in from the nurse manager, EAP referral — was noted positively by the team. These things matter especially in neonatology, where the work intersects with exactly this kind of loss.` },
  "88": { leave: `Submitted 'Bespoke neonatal leadership course, online — no accreditation' as study leave. Declined.`, family: `Unknown.`, backstory: `Remains anonymous in this directory by choice. The episode is included because it illustrates the pattern: online, unaccredited, self-directed activity submitted as study leave is a category error, not a close call. The decline was correct.` },
  "89": { leave: `Wanted October for MRCPCH Part 2 sitting. Rota can only absorb 2 per week. Deferred to January 2027.`, family: `Three separate individuals, all with legitimate exam plans disrupted by the arms race dynamic.`, backstory: `The department offered a supporting letter to the RCPCH explaining the rota constraint. All three accepted it. All three sat in January. All three passed.` },
  "90": { leave: `10 days in October — Warsaw and Zakopane (family skiing trip). His father has a hip condition and this may be one of the last winters he can ski.`, family: `Parents in Warsaw. Father has early hip osteoarthritis. Younger sister Kasia is a nurse in London.`, backstory: `He covered Thursday night voluntarily from REST on Dec 9. His back pain developed Dec 14. The OH investigation confirmed a pre-existing L5/S1 issue aggravated by the unusual posture of a night shift after a REST day. The management note reads: 'Should not have been asked given known back condition.' The rota lead did not know. This is itself a gap — medical history that might have been relevant to the deployment decision was never communicated.` },
  "91": { leave: `10 days in September — Stockholm, visiting family.`, family: `From Uppsala, Sweden. Parents in Stockholm. Partner is an Irish civil servant they met at a language exchange in Dublin.`, backstory: `On Dec 9, she extended OPD to NICU Long during the day shift. When asked about covering Thursday night as well, she said clearly and professionally: 'I've already done a full Long shift today. I can't safely do a night as well.' This boundary was correct. The rota lead accepted it immediately.` },
  "92": { leave: `Study leave Dec 2–3 (MRCPCH exam + prep). Annual leave 10 days in October — Lagos.`, family: `Parents in Lagos. Father is a retired teacher; mother runs a tailoring business. She is the third of four children. She is the family doctor, in every sense — they call her when any of them are unwell.`, backstory: `She covered Wednesday night on Dec 9 voluntarily. She had been back from study leave for a week. She was not asked to — she offered when she heard the rota lead making calls. She received TOIL. She used it to catch up on sleep and ring her mother.` },
  "93": { leave: `No annual leave in window. Her RF obligations were completed in Block B.`, family: `From Budapest. Partner Péter is a Hungarian-Irish architect working in Cork. They split weeks between Dublin and Cork, which is not ideal but is currently workable.`, backstory: `Pre-arranged for Monday night Dec 8 by the rota lead three weeks in advance. Said yes by email within two hours. Showed up. Did the shift. Went home. There is a version of professional life that is exactly this uncomplicated.` },
  "94": { leave: `No annual leave in window. Attends a one-day neonatal nutrition symposium in Dublin (study leave).`, family: `From Spiddal, Connemara. Irish first language. Partner is a secondary school teacher. She moonlights as a locum at weekends elsewhere — 'the mortgage is what it is.'`, backstory: `She covered NICU Long Mon–Wed Sep 7–9 with consultant countersignature on notes. She already knew the patients, the protocols, and most of the nurses by name. She is, as the scenario notes, someone who would be an excellent clinical resident if that were her role. She received a commendation letter and an extra study leave day. She used the study leave day to attend a preterm brain injury conference. Of course she did.` },
  "95": { leave: `No annual leave in window.`, family: `Parents in Accra. Came to Dublin on a fellowship in 2022. His wife Akua joined him in 2023 — she is a secondary school teacher in Dublin.`, backstory: `He covered nights Mon–Wed during the emergency week, 3 goodwill shifts. The nursing staff already trusted him. He received commendation letters for both his supervisor and the department. He pinned them above his desk in the lab.` },
  "96": { leave: `No annual leave in window. Attends a metabolomics conference in Kyoto (study leave, 5 days).`, family: `From Osaka. Parents in Osaka. Partner Seámus is an Irish engineer. They met in Tokyo where Seámus was on a working visa. Coming to Ireland was a mutual adventure.`, backstory: `She covered SCBU standard Sep 7–10, 4 consecutive goodwill shifts — the most of any RF in any scenario. She did this with the focused precision that characterises everything she does. The commendation letter addressed to her supervisor in Osaka was, her partner reports, translated and framed by her parents.` },
  "97": { leave: `5 days Nov 3–7 (awarded as remedy following grievance). Originally requested Oct 13–17.`, family: `From Modena, Italy. Parents still in Modena. He moved to Dublin at 18 for university. Has been here for 12 years and is ambivalent about whether this is home.`, backstory: `He has a prior history of successful grievances. He knows how the system works and uses it correctly. His three allegations were 1 unfounded, 1 partially upheld on process, and 1 upheld. He was right about two things and wrong about one. The improvements his complaint produced are real. He is not a villain. He is someone who found an injustice, got a lawyer's card out of habit, and then fought a more targeted battle than he could have.` },
  "98": { leave: `Oct 13–17 approved (submitted first — Day 9 of the window). Attends a neonatal conference in London and visits her sister in Ealing.`, family: `Parents in Coventry (moved from Amritsar in the 1980s). Sister Priya is a nurse in Ealing. She visits whenever she's in London.`, backstory: `She was caught in a grievance through no fault of her own. The decision to approve her leave was correct. The fact that it couldn't be immediately proven (due to timestamping failure) was stressful for about three weeks. She came through it with her reputation intact and a new appreciation for keeping submission receipts.` },
  "99": { leave: `10 days in August — Clare Island with her husband and two children.`, family: `Husband Ciarán is a landscape architect. Two children, Oisín (7) and Sorcha (4). She grew up in Dublin but her husband's family have a house on Clare Island.`, backstory: `She asked the rota lead to put all arrangements in writing during the grievance period. Not as a complaint — as a precaution. 'I've seen how these things go,' she said. She was right to ask. Everything was in writing. Nothing from her arrangements was ever in dispute.` },
  "100": { leave: `5 days in November — home to Thurles for her cousin's wedding.`, family: `From Thurles. Parents still there. Father is a secondary school principal; mother a GP practice nurse.`, backstory: `She arrived in Week 1 and watched the grievance unfold with wide eyes. By Week 11 she had a comprehensive understanding of leave systems, submission timestamping, Flex rotation formulas, and the difference between a valid allegation and a strategic one. This is not the education she expected from this rotation, but it may be the most useful thing she takes from it.` },
  "101": { leave: `10 days in August — Dingle with her partner Ciarán and his family.`, family: `Partner Ciarán is a primary school teacher. They are engaged — wedding planned for March 2027. She has been planning the wedding in the background of this entire rotation.`, backstory: `She extended on Oct 20 to cover PNW Long when Esther was admitted. She then covered Night 4 on Oct 29 — the night where one person saying no would have left a service uncovered. She agreed without drama. She received TOIL Friday and a personal call from the clinical director. She spent the TOIL day finalising her wedding venue.` },
  "102": { leave: `12 days in September — Chennai for her parents' anniversary and a family function.`, family: `Parents in Chennai. Father is a retired judge; mother a retired college principal. She came to Ireland via a UK training programme. She does not plan to go back.`, backstory: `She volunteered Night 2 on Oct 27 without being asked. She had seen the situation developing and made the calculation herself. She got TOIL Wednesday. She used it to sleep, cook a proper meal, and video-call her mother. She did not mention to her mother that she had covered an emergency night shift the day before.` },
  "103": { leave: `Had 10 days approved in August — Lagos. Taken. October leave: appendicectomy and recovery.`, family: `Parents in Lagos. Her father is a retired engineer. Her older brother is a paediatrician in Abuja — the family member who most understands what her work involves.`, backstory: `She developed acute right iliac fossa pain during a ward round on Oct 20. A junior nurse noticed she was moving differently and asked if she was okay. She was admitted by lunchtime. Laparoscopic appendicectomy that afternoon. She texted the rota lead from recovery: 'Sorry for the disruption.' The rota lead texted back: 'Get some rest. We've got it.'` },
  "104": { leave: `Had 10 days approved in September — Connemara, solo walking. He went. It was the last good week.`, family: `From Bray. Parents in Bray. Younger sister in Australia. He lives alone in Dublin. His closest friend from medical school died of cancer in June.`, backstory: `He went AWOL on Oct 26. He was with his parents in Bray. He was not in danger — but he was not well. He had been internalising the grief of his friend's death, the isolation of living alone, and the relentlessness of the rotation since July. The mental health crisis was genuine. The EAP engagement was positive. His phased return in Week 18 was carefully managed. He is, at the end of the window, better than he was at the start.` },
  "105": { leave: `5 days in September — Inis Mór. Irish speaker, from Connemara.`, family: `From An Cheathrú Rua, Conamara. Parents still there. She is a native speaker.`, backstory: `Her first major Flex deployment happened on Oct 26 — the morning Conal didn't show up. She absorbed his SCBU Long shift. It was her first time holding a Long shift solo. She handled it competently. The rota lead called her that evening to say so explicitly. She said 'Go raibh maith agat' and hung up.` },
  "106": { leave: `8 days in August — Wexford, family holiday.`, family: `From Wexford. Parents still there. Father works at Rosslare port; mother is a primary school teacher.`, backstory: `She covered Sunday night Nov 1 — the last piece of the Perfect Storm cover puzzle. It was the first time she had ever covered a night shift in her training. A consultant was present throughout. She was competent and professional. She rang her mother the next morning. She did not explain why she was awake.` },
  "107": { leave: `Study leave Oct 19–20 (MRCPCH exam). Annual leave 10 days in July — Lagos, her parents' 40th wedding anniversary.`, family: `Parents in Lagos. Mother is a retired civil servant; father still works in banking.`, backstory: `She returned from exam leave and immediately volunteered Friday night Oct 30. Nobody asked her. She saw the situation and offered. She did not keep score. This is the quality that the rota's resilience ultimately depends on — people who offer before they're asked.` },
  "108": { leave: `No annual leave in window.`, family: `From An Daingean, Kerry. Irish first language. Parents in Dingle. Partner is a marine biologist at University College Cork.`, backstory: `She covered Monday night Oct 26 goodwill. Was formally notified of her remaining balance (1 shift). Said: 'Grand. I'll keep it for something actually critical.' She meant this. It was respected.` },
  "109": { leave: `No annual leave in window.`, family: `Parents in Kumasi, Ghana. He came to Ireland for a fellowship on preterm cardiac development. His partner is an Irish solicitor.`, backstory: `He covered Wednesday night Oct 28 and Saturday night Oct 31 — 2 goodwill shifts. He had 4 remaining at the start of the storm and 2 after. He was told this clearly. He responded: 'I'll hold onto them. You never know what December will bring.' December did, indeed, bring things.` }
};
