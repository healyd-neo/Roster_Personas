  {id:8,sc:1,sn:"The Dream Team",v:"robust",name:"Dr. Jakub Novotný",role:"clinical",pgy:"PGY-3",nat:"Czech-Irish",desc:"Precise and punctual. Models his rounds on the consultant he most admires.",ev:"10 days Oct leave — clean block, no clash, approved first time.",et:"green",arch:[],tags:["Czech-Irish","PGY-3"]},
  {id:9,sc:1,sn:"The Dream Team",v:"robust",name:"Dr. Naomi Adesanya",role:"clinical",pgy:"PGY-2",nat:"Irish (Dublin)",desc:"Quiet achiever. Arrives early, stays late, asks good questions.",ev:"Wednesday swap with Ben — rota lead retrospectively approves it.",et:"green",arch:[],tags:["Irish","Dublin","PGY-2"]},
  {id:10,sc:1,sn:"The Dream Team",v:"robust",name:"Dr. Conor Whelan",role:"clinical",pgy:"PGY-4",nat:"Irish (Waterford)",desc:"Finishing training, preparing a fellowship application. Mentally half elsewhere by October. Clinical work fine; admin outputs perpetually late.",ev:"Fellowship writing retreat declined as study leave. Síofra has a quiet word. Forms submitted by Week 12.",et:"amber",arch:[],tags:["Irish","Waterford","PGY-4"]},
  {id:11,sc:1,sn:"The Dream Team",v:"robust",name:"Dr. Ingrid Svensson",role:"rf",pgy:"RF",nat:"Swedish",desc:"Disciplined, reliable Neurodevelopment PhD fellow. Submits blackout dates in Week 1.",ev:"Obligatory weekends clean. Nov blackout — pre-arranged swap to Nov 22.",et:"green",arch:[],tags:["Swedish","RF"]},
  {id:12,sc:1,sn:"The Dream Team",v:"robust",name:"Dr. Pádraig Ó'Sé",role:"rf",pgy:"RF",nat:"Irish (Kerry)",desc:"Easygoing Metabolomics fellow. Never causes drama.",ev:"Two obligatory weekends completed without incident.",et:"green",arch:[],tags:["Irish","Kerry","RF"]},
  {id:13,sc:1,sn:"The Dream Team",v:"robust",name:"Dr. Zara Obi",role:"rf",pgy:"RF",nat:"Nigerian-Irish",desc:"Organised Nutrition PhD fellow. First to have schedule confirmed.",ev:"Obligatory weekends completed. Nov blackout managed via pre-arranged swap.",et:"green",arch:[],tags:["Nigerian-Irish","RF"]},
  {id:14,sc:2,sn:"The Pregnancy Problem",v:"stressed",name:"Dr. Tomás Sheridan",role:"clinical",pgy:"PGY-4",nat:"Irish",desc:"Solid, reliable senior. Absorbs part of P2 load voluntarily after Aoife's maternity departure.",ev:"Extra shifts final 4 weeks. TOIL documented and honoured.",et:"amber",arch:["anchor"],tags:["Irish","PGY-4"]},
  {id:15,sc:2,sn:"The Pregnancy Problem",v:"stressed",name:"Dr. Aoife Maguire",role:"clinical",pgy:"PGY-3",nat:"Irish",desc:"18 weeks pregnant at window start. Nights restricted from Week 8. Fully fit for daytime. Front-loads annual leave.",ev:"Nights swap with Dev arranged Week 4. Leaves on maternity Week 20.",et:"amber",arch:["burnout"],tags:["Irish","PGY-3","pregnancy"]},
  {id:16,sc:2,sn:"The Pregnancy Problem",v:"stressed",name:"Dr. Dev Krishnamurthy",role:"clinical",pgy:"PGY-3",nat:"Indian-Irish",desc:"Capable and accommodating. Agrees to nights swap without hesitation.",ev:"Swap signed Week 4. Nights covered without incident through Weeks 8–18.",et:"green",arch:["hero"],tags:["Indian-Irish","PGY-3"]},
  {id:17,sc:2,sn:"The Pregnancy Problem",v:"stressed",name:"Dr. Marcus O'Brien",role:"clinical",pgy:"PGY-3",nat:"Irish",desc:"Methodical, good at nights. Covers Aoife's Weekend Nights. Gets OPD day in return.",ev:"Weekend nights swap HR-approved. No incidents.",et:"green",arch:[],tags:["Irish","PGY-3"]},
  {id:18,sc:3,sn:"The Absconder",v:"stressed",name:"Dr. Caoimhe Brennan",role:"clinical",pgy:"PGY-4",nat:"Irish",desc:"Competent senior who takes charge in a crisis. Covers Saturday night. Receives TOIL Monday.",ev:"Saturday night cover. TOIL honoured.",et:"amber",arch:["anchor"],tags:["Irish","PGY-4"]},
  {id:19,sc:3,sn:"The Absconder",v:"stressed",name:"Dr. 'Robbie' Roberts",role:"clinical",pgy:"PGY-2",nat:"Irish",desc:"Has been struggling with personal issues. On an informal PIP. Stops showing up in Week 9 — no call, no text.",ev:"AWOL from Sep 7. GP cert 7 weeks. Returns Week 14 (days only), full duties Week 18. EAP involved.",et:"red",arch:["problematic","burnout"],tags:["Irish","PGY-2","AWOL","burnout"]},
  {id:20,sc:3,sn:"The Absconder",v:"stressed",name:"Dr. Stefan Novak",role:"clinical",pgy:"PGY-3",nat:"Slovak-Irish",desc:"Reliable. Covers Sunday night during Robbie's crisis. Receives TOIL Monday.",ev:"Sunday night voluntary. TOIL documented.",et:"amber",arch:[],tags:["Slovak-Irish","PGY-3"]},
  {id:21,sc:3,sn:"The Absconder",v:"stressed",name:"Dr. Layla Hassan",role:"clinical",pgy:"PGY-3",nat:"Egyptian-Irish",desc:"Excellent clinician, calm under pressure. Swaps OPD day for Robbie's Wednesday night.",ev:"Wednesday night cover Week 9. Swap documented.",et:"amber",arch:[],tags:["Egyptian-Irish","PGY-3"]},
  {id:22,sc:3,sn:"The Absconder",v:"stressed",name:"Dr. Preethi Subramanian",role:"clinical",pgy:"PGY-3",nat:"Indian-Irish",desc:"Outstanding, always early. Volunteers Thursday night. Extends from SCBU standard.",ev:"Thursday night voluntary. Post-nights rest observed Friday.",et:"amber",arch:["hero"],tags:["Indian-Irish","PGY-3"]},
  {id:23,sc:3,sn:"The Absconder",v:"stressed",name:"Dr. David Park",role:"rf",pgy:"RF",nat:"Korean-Irish",desc:"Organised RF. Covers Tuesday night goodwill. Cannot cover consecutive nights.",ev:"1 RF goodwill shift. Constraints explained and respected.",et:"amber",arch:[],tags:["Korean-Irish","RF"]},
  {id:24,sc:3,sn:"The Absconder",v:"stressed",name:"Dr. Fiona Horgan",role:"rf",pgy:"RF",nat:"Irish",desc:"Reliable RF. Covers Friday night (Weekend Nights start) during Robbie's Week 9 absence.",ev:"1 RF goodwill shift (Friday night).",et:"amber",arch:[],tags:["Irish","RF"]},
  {id:25,sc:4,sn:"The Long-Term Sick",v:"stressed",name:"Dr. Áine O'Sullivan",role:"clinical",pgy:"PGY-4",nat:"Irish",desc:"Most senior resident. Develops acute viral myocarditis Week 3. Off 11 weeks. Phased return Week 14.",ev:"11-week absence triggers locum. AL preserved and used December.",et:"red",arch:["burnout"],tags:["Irish","PGY-4","myocarditis"]},
  {id:26,sc:4,sn:"The Long-Term Sick",v:"stressed",name:"Dr. Parisa Karimi",role:"clinical",pgy:"PGY-4",nat:"Iranian-Irish",desc:"Steps into Áine's leadership role. Volunteers nights Weeks 3–5. Hours near maximum.",ev:"Defers 5 AL days. Covers nights 2 cycles. Peer support check-in Week 10.",et:"amber",arch:["hero","anchor"],tags:["Iranian-Irish","PGY-4"]},
  {id:27,sc:4,sn:"The Long-Term Sick",v:"stressed",name:"Dr. Kwame Asante",role:"clinical",pgy:"PGY-3",nat:"Ghanaian-Irish",desc:"Becomes effective most-senior after Áine's admission. Steps up gracefully.",ev:"Deferred leave Oct/Nov once Kofi settles.",et:"amber",arch:["anchor"],tags:["Ghanaian-Irish","PGY-3"]},
  {id:28,sc:4,sn:"The Long-Term Sick",v:"stressed",name:"Dr. Kofi Mensah",role:"locum",pgy:"PGY-3",nat:"Ghanaian-Irish",desc:"Agency locum. Cautious initially but competent. Parisa briefs him informally.",ev:"Fills P1 from Week 7. Full capacity Week 9. Demobilised Week 14.",et:"green",arch:[],tags:["Ghanaian-Irish","PGY-3","locum"]},
  {id:29,sc:4,sn:"The Long-Term Sick",v:"stressed",name:"Dr. Antoine Moreau",role:"rf",pgy:"RF",nat:"French",desc:"Organised RF. Covers 2 nights goodwill in Week 6 during the pre-locum gap.",ev:"2 RF goodwill shifts. Reserve rebuilds once Kofi in post.",et:"amber",arch:[],tags:["French","RF"]},
  {id:30,sc:5,sn:"The Leave Tsunami",v:"stressed",name:"Dr. Marco Ferretti",role:"clinical",pgy:"PGY-2",nat:"Italian-Irish",desc:"Booked flights to Italy for his grandmother's 90th birthday without getting leave approved first. Furious when leave is redirected to October.",ev:"Formal complaint. 3 compassionate days in Oct for shorter Italy trip. Relations normalise.",et:"red",arch:["problematic"],tags:["Italian-Irish","PGY-2"]},
  {id:31,sc:5,sn:"The Leave Tsunami",v:"stressed",name:"Dr. Sharon Costelloe",role:"clinical",pgy:"PGY-4",nat:"Irish",desc:"PGY-4 who gets Aug 10–14 priority. Template slot aligns, seniority applies. Not popular for it.",ev:"Gets Aug 10–14 approved. Fair by matrix.",et:"green",arch:[],tags:["Irish","PGY-4"]},
  {id:32,sc:5,sn:"The Leave Tsunami",v:"stressed",name:"Dr. Ailbhe Conneely",role:"clinical",pgy:"PGY-4",nat:"Irish",desc:"Second Aug 10–14 priority approval. Easy-going throughout.",ev:"Clean run through rest of window.",et:"green",arch:[],tags:["Irish","PGY-4"]},
  {id:33,sc:5,sn:"The Leave Tsunami",v:"stressed",name:"Dr. Nadia Korhonen",role:"clinical",pgy:"PGY-3",nat:"Finnish-Irish",desc:"Sensible split request — 5 days Aug, 5 days Sep. Gets caught in Sep clash with Igor.",ev:"Sep 7–11: she + Igor = 2 out. Sharon (Flex) covers. Clean.",et:"green",arch:[],tags:["Finnish-Irish","PGY-3"]},
  {id:34,sc:6,sn:"The Toxic Dynamic",v:"stressed",name:"Dr. Declan Farrell",role:"clinical",pgy:"PGY-4",nat:"Irish",desc:"Senior but aloof. Refuses all informal arrangements. Has had a documented verbal altercation with Aidan.",ev:"Formally counselled Week 11. Handovers improved under ISBAR protocol.",et:"red",arch:["problematic"],tags:["Irish","PGY-4","toxic"]},
  {id:35,sc:6,sn:"The Toxic Dynamic",v:"stressed",name:"Dr. Aidan Byrne",role:"clinical",pgy:"PGY-4",nat:"Irish",desc:"In the other clique. Documented altercation with Declan. Escalates every swap request.",ev:"Formally counselled alongside Declan Week 11.",et:"amber",arch:["problematic"],tags:["Irish","PGY-4","toxic"]},
  {id:36,sc:6,sn:"The Toxic Dynamic",v:"stressed",name:"Dr. Tomasz Wiśniewski",role:"clinical",pgy:"PGY-3",nat:"Polish-Irish",desc:"Allied with Declan. Won't cover without formal documentation. 45-min phone call before flexing.",ev:"Email-before-flexing becomes protocol. Technically correct, practically exhausting.",et:"amber",arch:["problematic"],tags:["Polish-Irish","PGY-3","toxic"]},
  {id:37,sc:6,sn:"The Toxic Dynamic",v:"stressed",name:"Dr. Yewande Oloja",role:"clinical",pgy:"PGY-3",nat:"Nigerian-Irish",desc:"Capable but caught between cliques. Exhausted. Considering a transfer by Week 16.",ev:"2-day genuine illness Week 5. Morale trajectory negative throughout.",et:"amber",arch:["burnout"],tags:["Nigerian-Irish","PGY-3","burnout"]},

  {id:39,sc:6,sn:"The Toxic Dynamic",v:"stressed",name:"Dr. Siobhán Naughton",role:"clinical",pgy:"PGY-3",nat:"Irish",desc:"Sends one-line incomplete handover to Claire Week 10. Near-miss incident.",ev:"Near-miss Week 10. ISBAR protocol enforced.",et:"red",arch:["problematic"],tags:["Irish","PGY-3","near-miss"]},
  {id:40,sc:6,sn:"The Toxic Dynamic",v:"stressed",name:"Dr. Bobby Osei",role:"clinical",pgy:"PGY-2",nat:"Ghanaian-Irish",desc:"Junior, intimidated by the dynamic. Demoralised by Week 8.",ev:"3-day illness Week 13. No formal support offered — management action missed.",et:"amber",arch:[],tags:["Ghanaian-Irish","PGY-2"]},
  {id:41,sc:6,sn:"The Toxic Dynamic",v:"stressed",name:"Dr. Una Ní Fhaoláin",role:"clinical",pgy:"PGY-2",nat:"Irish (Gaeltacht)",desc:"New to the department. Watches carefully. Demoralised by Week 8.",ev:"Flagged as at risk in management review.",et:"amber",arch:[],tags:["Irish","Gaeltacht","PGY-2"]},
  {id:42,sc:6,sn:"The Toxic Dynamic",v:"stressed",name:"Dr. Sam Bradley",role:"rf",pgy:"RF",nat:"Irish",desc:"Tries to bridge the cliques through aggressive friendliness. Largely fails.",ev:"Bridge-building effort fails. Stays out of formal complaint process.",et:"amber",arch:[],tags:["Irish","RF"]},
  {id:43,sc:7,sn:"The Exam Season Crush",v:"breakdown",name:"Dr. Orla Breathnach",role:"clinical",pgy:"PGY-4",nat:"Irish (Gaeltacht)",desc:"Sole senior not sitting any exam. Absorbs enormous extra burden Oct–Nov as everyone else is on study leave.",ev:"REST-day and Flex deployments across 5 study leave weeks. Commendation + first-priority leave.",et:"amber",arch:["hero","anchor"],tags:["Irish","Gaeltacht","PGY-4"]},
  {id:44,sc:7,sn:"The Exam Season Crush",v:"breakdown",name:"Dr. Aoibhinn Heneghan",role:"clinical",pgy:"PGY-2",nat:"Irish",desc:"Junior resident not sitting any exam. Absorbs extra Long shifts alongside Orla.",ev:"Multiple extended shifts. First-priority leave next window.",et:"amber",arch:["hero"],tags:["Irish","PGY-2"]},
  {id:45,sc:7,sn:"The Exam Season Crush",v:"breakdown",name:"Dr. Luke Stapleton",role:"clinical",pgy:"PGY-2",nat:"Irish",desc:"PGY-2 sitting Part 1. Annoyed his prep day was moved by 2 days. Accepts it. Passes.",ev:"Prep day moved Nov 4. Sits exam Nov 5. Passes Part 1.",et:"amber",arch:[],tags:["Irish","PGY-2"]},
  {id:46,sc:7,sn:"The Exam Season Crush",v:"breakdown",name:"Dr. Patricia Nwosu",role:"rf",pgy:"RF",nat:"Nigerian-Irish",desc:"Covers nights Nov 5 — the last piece of cover when all options exhausted.",ev:"1 RF goodwill shift (Nov 5 nights). Pre-arranged Week 14.",et:"amber",arch:["hero"],tags:["Nigerian-Irish","RF"]},
  {id:47,sc:8,sn:"Cascading Sick Leave",v:"stressed",name:"Dr. Tara Flanagan",role:"clinical",pgy:"PGY-4",nat:"Irish",desc:"Senior asked to swap or extend 3 times by Week 12. Says yes every time.",ev:"1:1 acknowledgment + first-choice shift final 4 weeks.",et:"amber",arch:["hero"],tags:["Irish","PGY-4"]},
  {id:48,sc:8,sn:"Cascading Sick Leave",v:"stressed",name:"Dr. Pádraig Ó'Laoire",role:"clinical",pgy:"PGY-2",nat:"Irish",desc:"Junior PGY-2 correctly deployed to OPD only — not PNW Long solo.",ev:"Supervision constraint formally documented.",et:"amber",arch:[],tags:["Irish","PGY-2"]},
  {id:49,sc:8,sn:"Cascading Sick Leave",v:"stressed",name:"Dr. Amelia Walsh",role:"clinical",pgy:"PGY-3",nat:"Irish",desc:"Covers Wed+Thu nights during Ivan's back pain absence. TOIL documented.",ev:"2 nights cover as extended swap.",et:"amber",arch:[],tags:["Irish","PGY-3"]},
  {id:50,sc:8,sn:"Cascading Sick Leave",v:"stressed",name:"Dr. Conall Breathnach",role:"clinical",pgy:"PGY-2",nat:"Irish (Gaeltacht)",desc:"Develops anxiety/stress — 3 days sick leave Week 16.",ev:"Flex absorbs. OH check-in offered and accepted.",et:"amber",arch:["burnout"],tags:["Irish","Gaeltacht","PGY-2","burnout"]},
  {id:51,sc:8,sn:"Cascading Sick Leave",v:"stressed",name:"Dr. Miriam Johansson",role:"rf",pgy:"RF",nat:"Swedish",desc:"Reliable RF with a 6-week-old daughter at home. Covers 2 goodwill nights. Mentions the baby afterward — not as a complaint.",ev:"2 RF goodwill shifts (Mon+Tue nights).",et:"amber",arch:[],tags:["Swedish","RF"]},
  {id:52,sc:9,sn:"The RF Collapse",v:"stressed",name:"Dr. Ana Petrova",role:"rf",pgy:"RF",nat:"Bulgarian-Irish",desc:"Sole surviving RF from Week 9. Agrees to one extra Block B weekend above obligation. Respectfully declines to cover all three.",ev:"Covers Oct 3–4 (obligatory) and Oct 17–18 (goodwill). Goodwill carefully rationed.",et:"amber",arch:["hero","anchor"],tags:["Bulgarian-Irish","RF"]},
  {id:53,sc:9,sn:"The RF Collapse",v:"stressed",name:"Dr. Carlos Reyes",role:"rf",pgy:"RF",nat:"Spanish-Irish",desc:"RF who leaves Week 6 — mother had a stroke in Seville. Non-negotiable.",ev:"Departs Week 6. Block B weekend reassigned to Ana.",et:"red",arch:[],tags:["Spanish-Irish","RF"]},
  {id:54,sc:9,sn:"The RF Collapse",v:"stressed",name:"Dr. Niamh Fahey",role:"rf",pgy:"RF",nat:"Irish",desc:"Contract terminated Week 8 for three consecutive no-shows. No explanation received.",ev:"Contract terminated. Employment law documentation maintained.",et:"red",arch:["problematic"],tags:["Irish","RF","AWOL"]},
  {id:55,sc:9,sn:"The RF Collapse",v:"stressed",name:"Dr. Theresa Okafor",role:"clinical",pgy:"PGY-3",nat:"Nigerian-Irish",desc:"Covers Oct 10 Saturday as overtime pay when no RF is available.",ev:"NICU+SCBU Sat at weekend overtime rate. TOIL Monday.",et:"amber",arch:["hero"],tags:["Nigerian-Irish","PGY-3"]},
  {id:56,sc:9,sn:"The RF Collapse",v:"stressed",name:"Dr. Lukasz Kowal",role:"clinical",pgy:"PGY-3",nat:"Polish",desc:"Covers Oct 11 Sunday as overtime pay.",ev:"NICU+SCBU Sun at weekend overtime rate. TOIL Monday.",et:"amber",arch:[],tags:["Polish","PGY-3"]},
  {id:57,sc:10,sn:"The Overleave Cluster",v:"robust",name:"Dr. Rián Ó'Briain",role:"clinical",pgy:"PGY-4",nat:"Irish",desc:"Requests 22 days annual leave — 4 over limit. Claims seniority justifies it. Appeals to clinical director. Director upholds the limit.",ev:"Cut to 15 days. Visibly difficult 3 weeks. Clinically adequate.",et:"amber",arch:["problematic"],tags:["Irish","PGY-4"]},
  {id:58,sc:10,sn:"The Overleave Cluster",v:"robust",name:"Dr. Blessing Ogwu",role:"clinical",pgy:"PGY-3",nat:"Nigerian-Irish",desc:"Requests 17 AL + 18 SL = 35 days total. Tries to reclassify declined AL days as study leave.",ev:"13 AL + 4 SL approved. Uses every day with strategic efficiency.",et:"amber",arch:["problematic"],tags:["Nigerian-Irish","PGY-3"]},
  {id:59,sc:10,sn:"The Overleave Cluster",v:"robust",name:"Dr. Fionnula Harte",role:"clinical",pgy:"PGY-3",nat:"Irish",desc:"Wants all 15 days in August. Won't compromise. Rota lead invokes the 2-simultaneous rule. She takes 10 Aug + 5 Oct. Sulks.",ev:"Redistributed under formal rule. Clinical performance unaffected. Remains frosty.",et:"amber",arch:["problematic"],tags:["Irish","PGY-3"]},
  {id:60,sc:10,sn:"The Overleave Cluster",v:"robust",name:"Dr. Karl Svenson",role:"clinical",pgy:"PGY-3",nat:"Swedish-Irish",desc:"Wants 2 isolated single AL days. Claims EU working time rights. Sep 17 approved; Nov 20 moved to Nov 13.",ev:"Complains about EWTD. His partner got the London job.",et:"amber",arch:["problematic"],tags:["Swedish-Irish","PGY-3"]},
  {id:61,sc:10,sn:"The Overleave Cluster",v:"robust",name:"Dr. Adaeze Nwankwo",role:"clinical",pgy:"PGY-4",nat:"Nigerian-Irish",desc:"Perfect compliance. The only resident behaving correctly. Quietly frustrated watching colleagues consume admin time.",ev:"All leave approved first submission. A pleasure to manage.",et:"green",arch:["anchor"],tags:["Nigerian-Irish","PGY-4"]},
  {id:62,sc:11,sn:"The Winter Viral Surge",v:"breakdown",name:"Dr. Alinta Watson",role:"rf",pgy:"RF",nat:"Aboriginal-Australian-Irish",desc:"RF2. Healthy throughout norovirus wave. Covers Tue+Wed nights Nov 18–19 — the two most critical nights.",ev:"2 RF goodwill shifts. Formal letter of thanks from clinical director.",et:"amber",arch:["hero"],tags:["Aboriginal-Australian-Irish","RF"]},
  {id:63,sc:11,sn:"The Winter Viral Surge",v:"breakdown",name:"Dr. Lara Pettersson",role:"clinical",pgy:"PGY-4",nat:"Swedish-Irish",desc:"Extends NICU standard to cover Orla's Long shift Nov 18 — the crisis day.",ev:"Extends to Long Nov 18. TOIL arranged.",et:"amber",arch:["hero"],tags:["Swedish-Irish","PGY-4"]},
  {id:64,sc:11,sn:"The Winter Viral Surge",v:"breakdown",name:"Dr. Tara Lyons",role:"clinical",pgy:"PGY-4",nat:"Irish",desc:"On annual leave Nov 10–12. Returns and immediately covers Ravi's PNW shift Nov 18 from REST.",ev:"Covers PNW Nov 18 from REST. TOIL Thursday.",et:"amber",arch:[],tags:["Irish","PGY-4"]},
  {id:65,sc:11,sn:"The Winter Viral Surge",v:"breakdown",name:"Dr. Cian Murphy",role:"rf",pgy:"RF",nat:"Irish",desc:"RF1 who catches norovirus himself Nov 18. Goodwill reserve frozen while unwell.",ev:"Gets norovirus Nov 18. Block B weekend already completed. No duty missed.",et:"amber",arch:[],tags:["Irish","RF"]},
  {id:66,sc:12,sn:"The High-Achiever Burnout",v:"stressed",name:"Dr. Caoimhe Ó'Ceallaigh",role:"clinical",pgy:"PGY-4",nat:"Irish",desc:"Self-presents to OH after sleeping 4h/night and losing 8kg. Panic attack on ward Week 11.",ev:"Signed off 3 weeks. Phased return Week 15 (days only). Full duties Week 17.",et:"red",arch:["burnout"],tags:["Irish","PGY-4","burnout"]},
  {id:67,sc:12,sn:"The High-Achiever Burnout",v:"stressed",name:"Dr. Femi Babatunde",role:"clinical",pgy:"PGY-4",nat:"Nigerian-Irish",desc:"Burnout Week 14 but refuses OH. Makes minor documentation errors by Week 15. Escalates to safety concern.",ev:"Ordered to attend OH as condition of continued practice. Signed off 2 weeks.",et:"red",arch:["burnout","problematic"],tags:["Nigerian-Irish","PGY-4","burnout"]},
  {id:68,sc:12,sn:"The High-Achiever Burnout",v:"stressed",name:"Dr. Julia Wróbel",role:"clinical",pgy:"PGY-3",nat:"Polish-Irish",desc:"Volunteers one of Caoimhe's nights. Gets TOIL Friday. Befriends Caoimhe during recovery.",ev:"Night cover Week 13. TOIL documented.",et:"amber",arch:["hero"],tags:["Polish-Irish","PGY-3"]},
  {id:69,sc:12,sn:"The High-Achiever Burnout",v:"stressed",name:"Dr. Nkechi Ezemenari",role:"clinical",pgy:"PGY-3",nat:"Nigerian-Irish",desc:"Volunteers 4th night. Asks for compensatory rest in writing before the weekend. It was there by end of day.",ev:"4th night covered voluntarily. Compensation and formal recognition.",et:"amber",arch:["hero"],tags:["Nigerian-Irish","PGY-3"]},
  {id:70,sc:12,sn:"The High-Achiever Burnout",v:"stressed",name:"Dr. Áine Costello",role:"clinical",pgy:"PGY-2",nat:"Irish",desc:"Covers Femi's PNW Long under supervision Week 16.",ev:"PNW Long under supervision. Acceptable with safeguard.",et:"amber",arch:[],tags:["Irish","PGY-2"]},
  {id:71,sc:13,sn:"The International Cohort",v:"robust",name:"Dr. Yosra Ben Salah",role:"clinical",pgy:"PGY-4",nat:"Tunisian-Irish",desc:"Excellent PGY-4. Prefers single-day cultural leave (Mawlid, family events) rather than blocks.",ev:"4 single-day cultural exceptions approved in writing. 11 remaining days as Aug block.",et:"green",arch:[],tags:["Tunisian-Irish","PGY-4","international"]},
  {id:72,sc:13,sn:"The International Cohort",v:"robust",name:"Dr. Piotr Jaworski",role:"clinical",pgy:"PGY-3",nat:"Polish",desc:"Arrives Week 1 with IMC registration delayed — cannot hold Nights independently until Week 3. Anna supervises first nights.",ev:"Credentials confirmed Week 3. 10 days Oct leave. No further restrictions.",et:"amber",arch:[],tags:["Polish","PGY-3","international","credentials"]},
  {id:73,sc:13,sn:"The International Cohort",v:"robust",name:"Dr. Hyun-Ji Kwon",role:"clinical",pgy:"PGY-2",nat:"Korean",desc:"Technically excellent but struggles to raise concerns verbally. Submits written notes instead. Almost causes escalation delay Week 4.",ev:"Mandatory verbal handover protocol as accommodation. Reviewed positively Week 8.",et:"amber",arch:["international"],tags:["Korean","PGY-2","international","communication"]},
  {id:74,sc:13,sn:"The International Cohort",v:"robust",name:"Dr. Reza Ahmadi",role:"clinical",pgy:"PGY-3",nat:"Iranian",desc:"Strong clinician. Friday prayers once monthly — leaves by 13:00. 5 micro-arrangements across the window.",ev:"Adenike covers Friday afternoons; Reza reciprocates on her study leave days.",et:"green",arch:[],tags:["Iranian","PGY-3","international"]},
  {id:75,sc:13,sn:"The International Cohort",v:"robust",name:"Dr. Anna Kowalska",role:"clinical",pgy:"PGY-3",nat:"Polish",desc:"Helps Piotr navigate the Irish rota system. Supervises his first nights when credentials pending.",ev:"REST disruption forewarned and agreed. Piotr's nights supervised safely.",et:"green",arch:["hero"],tags:["Polish","PGY-3","international"]},
  {id:76,sc:13,sn:"The International Cohort",v:"robust",name:"Dr. Fatou Diallo",role:"clinical",pgy:"PGY-3",nat:"Senegalese-French-Irish",desc:"Natural bridge between cultural groups and clinical teams. Good communicator throughout.",ev:"No clinical incidents. Informal cultural liaison during orientation.",et:"green",arch:[],tags:["Senegalese-French-Irish","PGY-3","international"]},
  {id:77,sc:14,sn:"The Domino Injury",v:"breakdown",name:"Dr. Ciaran Walsh",role:"clinical",pgy:"PGY-3",nat:"Irish",desc:"Injured in RTA after departmental social. Fractured collarbone, mild concussion. 6 weeks off. Texts rota lead from A&E.",ev:"6-week absence. Locum (Week 14) bridges final 3 weeks.",et:"red",arch:[],tags:["Irish","PGY-3","injury","RTA"]},
  {id:78,sc:14,sn:"The Domino Injury",v:"breakdown",name:"Dr. Bola Fashola",role:"clinical",pgy:"PGY-3",nat:"Nigerian-Irish",desc:"Also injured in same RTA. L4/L5 back strain. 3 weeks off, 3 weeks restricted. Quieter after the accident.",ev:"Restricted return Week 14. Emre covers all 4 nights Week 16. Full duties Week 17.",et:"red",arch:[],tags:["Nigerian-Irish","PGY-3","injury","RTA"]},
  {id:79,sc:14,sn:"The Domino Injury",v:"breakdown",name:"Dr. Roisín Hickey",role:"clinical",pgy:"PGY-4",nat:"Irish",desc:"Takes charge immediately. Cover plan drafted by 11am on Monday. Covers Sunday night.",ev:"Sunday night cover. TOIL documented. Senior anchor throughout.",et:"amber",arch:["anchor","hero"],tags:["Irish","PGY-4"]},
  {id:80,sc:14,sn:"The Domino Injury",v:"breakdown",name:"Dr. Nnamdi Obi",role:"clinical",pgy:"PGY-4",nat:"Nigerian-Irish",desc:"Covers Tuesday NICU Long from REST. Serves as informal Flex Week 15. Explicitly named for recognition.",ev:"TOIL documented. Critical informal Flex cover.",et:"amber",arch:["hero"],tags:["Nigerian-Irish","PGY-4"]},
  {id:81,sc:14,sn:"The Domino Injury",v:"breakdown",name:"Dr. Aigerim Bekova",role:"clinical",pgy:"PGY-3",nat:"Kazakh-Irish",desc:"Extends to Long on 3 of 5 days during Ciaran's Week 13 PNW Long absence.",ev:"3 days Long extension Week 13. TOIL and formal recognition.",et:"amber",arch:["hero"],tags:["Kazakh-Irish","PGY-3"]},
  {id:82,sc:14,sn:"The Domino Injury",v:"breakdown",name:"Dr. Eoin Lawlor",role:"rf",pgy:"RF",nat:"Irish",desc:"Uses 4 goodwill shifts — most of any RF in a 2-RF scenario. Formally notified of remaining balance (1 shift).",ev:"4 goodwill shifts used. Balance communicated. No further assumption.",et:"amber",arch:[],tags:["Irish","RF"]},
  {id:83,sc:15,sn:"The Grief Leave Cluster",v:"robust",name:"Dr. Emeka Dike",role:"clinical",pgy:"PGY-3",nat:"Nigerian-Irish",desc:"Father dies suddenly Week 9. Travels to Nigeria for funeral and burial rites. 10 days compassionate leave.",ev:"10-day leave. Team rallies; Aleksei volunteers nights before being asked.",et:"amber",arch:[],tags:["Nigerian-Irish","PGY-3","bereavement"]},
  {id:84,sc:15,sn:"The Grief Leave Cluster",v:"robust",name:"Dr. Aoife Kearney",role:"clinical",pgy:"PGY-4",nat:"Irish",desc:"Grandmother dies Week 3. 3 days compassionate leave. Has not cried yet by December.",ev:"3-day leave. Returns Thursday. No further impact.",et:"green",arch:[],tags:["Irish","PGY-4","bereavement"]},
  {id:85,sc:15,sn:"The Grief Leave Cluster",v:"robust",name:"Dr. Saoirse Moran",role:"clinical",pgy:"PGY-2",nat:"Irish",desc:"Her dog Biscuit died at 14. Granted 1 day uncertified sick leave with complete discretion. Texts thank-you a week later.",ev:"1-day uncertified sick leave. No team briefing on reason.",et:"green",arch:[],tags:["Irish","PGY-2","bereavement"]},
  {id:86,sc:15,sn:"The Grief Leave Cluster",v:"robust",name:"Dr. Aleksei Ivanov",role:"clinical",pgy:"PGY-3",nat:"Russian-Irish",desc:"Volunteers 2 nights during Emeka's bereavement absence before the rota lead asks.",ev:"2 nights voluntary (TOIL). Offered before being asked.",et:"green",arch:["hero"],tags:["Russian-Irish","PGY-3"]},
  {id:87,sc:15,sn:"The Grief Leave Cluster",v:"robust",name:"Dr. Yewande Taiwo",role:"clinical",pgy:"PGY-3",nat:"Nigerian-Irish",desc:"Infant cousin dies (stillbirth in the family) Week 16. 2 days compassionate leave approved immediately. On REST those days.",ev:"2-day leave approved within hours. Zero rota impact.",et:"green",arch:[],tags:["Nigerian-Irish","PGY-3","bereavement"]},
  {id:88,sc:16,sn:"The Study Leave Arms Race",v:"stressed",name:"Dr. (P8 — Arms Race)",role:"clinical",pgy:"PGY-3",nat:"Irish",desc:"Submits a self-directed online course with no accreditation as study leave. The textbook wrong category.",ev:"Declined. No external booking, no accreditation.",et:"red",arch:["problematic"],tags:["Irish","PGY-3"]},
  {id:89,sc:16,sn:"The Study Leave Arms Race",v:"stressed",name:"Dr. (P2/P4/P7 — Deferred)",role:"clinical",pgy:"PGY-3",nat:"Irish",desc:"Three residents who want Oct MRCPCH Part 2 but are staggered out. Rota can only absorb 2/week.",ev:"Deferred to January 2027. Supporting letter from department. All three pass.",et:"amber",arch:[],tags:["Irish","PGY-3"]},
  {id:90,sc:17,sn:"The Understaffed Winter",v:"breakdown",name:"Dr. Łukasz Nowak",role:"clinical",pgy:"PGY-3",nat:"Polish",desc:"Covers Thursday night voluntarily from REST Dec 9. Back pain Dec 14 — pre-existing L5/S1 aggravated. Should not have been asked.",ev:"Night cover Dec 9. Back pain sick leave Dec 14–16. OH investigation — pre-existing.",et:"red",arch:[],tags:["Polish","PGY-3"]},
  {id:91,sc:17,sn:"The Understaffed Winter",v:"breakdown",name:"Dr. Ingrid Almqvist",role:"clinical",pgy:"PGY-3",nat:"Swedish-Irish",desc:"Flex person Dec 9. Extends OPD to NICU Long during day. Correctly declines the Thursday night — cannot safely do consecutive day+night.",ev:"Extends to NICU Long. Professionally declines overnight. Boundary correctly held.",et:"green",arch:[],tags:["Swedish-Irish","PGY-3"]},
  {id:92,sc:17,sn:"The Understaffed Winter",v:"breakdown",name:"Dr. Nneka Obi",role:"clinical",pgy:"PGY-3",nat:"Nigerian-Irish",desc:"Offers to cover Wednesday night Dec 9 when she hears the rota lead making calls. Doesn't wait to be asked.",ev:"Wednesday night volunteer cover Dec 9. TOIL arranged.",et:"amber",arch:["hero"],tags:["Nigerian-Irish","PGY-3"]},
  {id:93,sc:17,sn:"The Understaffed Winter",v:"breakdown",name:"Dr. Beatrix Farkas",role:"rf",pgy:"RF",nat:"Hungarian-Irish",desc:"RF1 with 3 goodwill shifts remaining in December. Pre-arranged for Monday night Dec 8 three weeks in advance.",ev:"1 goodwill shift Monday night Dec 8. Remaining: 2.",et:"amber",arch:[],tags:["Hungarian-Irish","RF"]},
  {id:94,sc:18,sn:"The RF Heroes",v:"breakdown",name:"Dr. Aoife Breathnach",role:"rf",pgy:"RF",nat:"Irish",desc:"Moonlights as locum weekends elsewhere. Deeply familiar with the ward. Covers NICU Long Mon–Wed with consultant countersignature.",ev:"3 goodwill shifts (NICU Long Mon–Wed). Commendation + extra study leave day.",et:"amber",arch:["hero"],tags:["Irish","RF"]},
  {id:95,sc:18,sn:"The RF Heroes",v:"breakdown",name:"Dr. Kwabena Asante",role:"rf",pgy:"RF",nat:"Ghanaian-Irish",desc:"Warm RF, respected by nursing staff. Has covered nights previously. Covers nights Mon–Wed.",ev:"3 goodwill shifts (nights Mon–Wed). Commendation + extra study leave day.",et:"amber",arch:["hero"],tags:["Ghanaian-Irish","RF"]},
  {id:96,sc:18,sn:"The RF Heroes",v:"breakdown",name:"Dr. Yuki Ito",role:"rf",pgy:"RF",nat:"Japanese-Irish",desc:"Precise, methodical, excellent at SCBU. Covers SCBU standard Sep 7–10 — 4 consecutive goodwill shifts. Parents frame the commendation letter in Osaka.",ev:"4 goodwill shifts (SCBU Sep 7–10). Commendation + extra study leave day.",et:"amber",arch:["hero"],tags:["Japanese-Irish","RF"]},
  {id:97,sc:19,sn:"The Complaint Chain",v:"robust",name:"Dr. Marco Russo",role:"clinical",pgy:"PGY-3",nat:"Italian-Irish",desc:"Prior history of successful formal grievances. Files 3-allegation complaint Week 4. Professional on ward throughout. His complaint produces genuine systemic improvements.",ev:"2 allegations upheld. Gets Nov 3–7 leave as remedy. Flex formula published.",et:"amber",arch:["problematic"],tags:["Italian-Irish","PGY-3"]},
  {id:98,sc:19,sn:"The Complaint Chain",v:"robust",name:"Dr. Lena Kaur",role:"clinical",pgy:"PGY-3",nat:"Indian-Irish",desc:"Her leave approved over Marco's because she submitted first. Correct decision — but timestamping failure meant it couldn't initially be proven.",ev:"Leave correctly approved. Caught in grievance through no fault of her own.",et:"green",arch:[],tags:["Indian-Irish","PGY-3"]},
  {id:99,sc:19,sn:"The Complaint Chain",v:"robust",name:"Dr. Aifric Ní Cheallaigh",role:"clinical",pgy:"PGY-4",nat:"Irish",desc:"Senior, fair-minded. Quietly asks for all arrangements in writing during the grievance period.",ev:"All arrangements formally documented. Normal relationship restored Week 11.",et:"green",arch:[],tags:["Irish","PGY-4"]},
  {id:100,sc:19,sn:"The Complaint Chain",v:"robust",name:"Dr. Hannah O'Reilly",role:"clinical",pgy:"PGY-2",nat:"Irish",desc:"New PGY-2, watching everything. Bewildered by the grievance but emerges more rota-literate.",ev:"No direct impact. Observational learning.",et:"green",arch:[],tags:["Irish","PGY-2"]},
  {id:101,sc:20,sn:"The Perfect Storm",v:"breakdown",name:"Dr. Aoife Hannigan",role:"clinical",pgy:"PGY-4",nat:"Irish",desc:"One of two anchors. Extends to PNW Long Oct 20. Covers Night 4 Oct 29 — the night where one 'no' leaves nights uncovered. Her wedding is planned for March.",ev:"Extended Oct 20. Night 4 Oct 29. Clinical director personally acknowledges her.",et:"amber",arch:["hero","anchor"],tags:["Irish","PGY-4"]},
  {id:102,sc:20,sn:"The Perfect Storm",v:"breakdown",name:"Dr. Ananya Krishnan",role:"clinical",pgy:"PGY-4",nat:"Indian-Irish",desc:"The second anchor. Volunteers Night 2 without being asked. Her presence alongside Aoife keeps the rota from collapsing.",ev:"Night 2 volunteer. TOIL documented. Explicitly named for recognition.",et:"amber",arch:["hero","anchor"],tags:["Indian-Irish","PGY-4"]},
  {id:103,sc:20,sn:"The Perfect Storm",v:"breakdown",name:"Dr. Esther Okafor",role:"clinical",pgy:"PGY-3",nat:"Nigerian-Irish",desc:"Develops acute appendicitis during a ward round Oct 20. Admitted same day. Texts rota lead from recovery: 'Sorry for the disruption.'",ev:"Admitted Oct 20. 3-week minimum off. Locum requested immediately.",et:"red",arch:[],tags:["Nigerian-Irish","PGY-3","surgical"]},
  {id:104,sc:20,sn:"The Perfect Storm",v:"breakdown",name:"Dr. Conal Higgins",role:"clinical",pgy:"PGY-3",nat:"Irish",desc:"Goes AWOL Oct 26 — mental health crisis. With his parents in Bray. His closest friend from medical school died of cancer in June.",ev:"AWOL Oct 26. Mental health crisis. 4-week minimum. Phased return with OH + EAP sign-off.",et:"red",arch:["burnout","problematic"],tags:["Irish","PGY-3","mental-health","AWOL"]},
  {id:105,sc:20,sn:"The Perfect Storm",v:"breakdown",name:"Dr. Saoirse Ní Fhaoláin",role:"clinical",pgy:"PGY-2",nat:"Irish",desc:"Junior PGY-2 on her first major Flex deployment Oct 26. Absorbs Conal's SCBU Long. Handles it.",ev:"First major Flex deployment. Rota lead calls that evening to acknowledge.",et:"amber",arch:[],tags:["Irish","PGY-2"]},
  {id:106,sc:20,sn:"The Perfect Storm",v:"breakdown",name:"Dr. Rachel Byrne",role:"clinical",pgy:"PGY-2",nat:"Irish",desc:"Junior PGY-2 covering Sunday night Nov 1 — her very first night shift ever. Consultant present. Rings her mother the next morning without explaining why.",ev:"First ever night cover. Consultant on-site. Managed safely.",et:"amber",arch:[],tags:["Irish","PGY-2"]},
  {id:107,sc:20,sn:"The Perfect Storm",v:"breakdown",name:"Dr. Tolu Adesanya",role:"clinical",pgy:"PGY-3",nat:"Nigerian-Irish",desc:"Returns from MRCPCH exam leave and immediately volunteers Friday night Oct 30. Nobody asked her. She saw the situation and offered.",ev:"Returns from exam and immediately covers voluntary Friday night.",et:"amber",arch:["hero"],tags:["Nigerian-Irish","PGY-3"]},
  {id:108,sc:20,sn:"The Perfect Storm",v:"breakdown",name:"Dr. Fionnuala Mac Giolla Chuda",role:"rf",pgy:"RF",nat:"Irish",desc:"RF1. Covers Monday night Oct 26. 1 goodwill shift remaining after the storm. Says: 'I'll keep it for something actually critical.'",ev:"1 goodwill shift (Mon Oct 26). 1 remaining. Balance communicated.",et:"amber",arch:[],tags:["Irish","RF"]},
  {id:109,sc:20,sn:"The Perfect Storm",v:"breakdown",name:"Dr. Emmanuel Osei",role:"rf",pgy:"RF",nat:"Ghanaian-Irish",desc:"RF2. Covers Wed night Oct 28 and Sat night Oct 31. Says: 'You never know what December will bring.' December did, indeed, bring things.",ev:"2 goodwill shifts (Wed Oct 28, Sat Oct 31). 2 remaining.",et:"amber",arch:[],tags:["Ghanaian-Irish","RF"]},
];
let typeF='all',verdictF=null,archF=null;
function getB(id){return backstoryData[String(id)]||{};}
function buildCards(){
  const main=document.getElementById('main');
  main.innerHTML='<div class="nores" id="nores">No characters match your search.</div>';
  const bySc={};
  people.forEach(p=>{if(!bySc[p.sc])bySc[p.sc]=[];bySc[p.sc].push(p);});
  Object.keys(bySc).sort((a,b)=>+a-+b).forEach(sc=>{
    const arr=bySc[sc];
    const sd=document.createElement('div');sd.className='sdiv';
    sd.innerHTML=`<h2>Scenario ${String(sc).padStart(2,'0')} · ${arr[0].sn}</h2>`;
    main.appendChild(sd);
    const grid=document.createElement('div');grid.className='grid';grid.dataset.sc=sc;
    main.appendChild(grid);
    arr.forEach(p=>{
      const b=getB(p.id);
      const roleL=p.role==='clinical'?'Clinical Resident':p.role==='rf'?'Research Fellow':'Locum';
      const strC=p.role==='clinical'?'sc':p.role==='rf'?'sr':'sl';
      const tagRC=p.role==='clinical'?'tr':p.role==='rf'?'tp':'tl';
      const vL=p.v==='robust'?'Robust':p.v==='stressed'?'Stressed':'Breakdown';
      const bCol=scColors[p.sc]||'#333';
      const aTags=p.arch.map(a=>`<span class="tag tpgy">${aicons[a]||''} ${a}</span>`).join('');
      const evC='ev-'+p.et;
      const srchTxt=[p.name,p.desc,p.ev,p.nat,p.pgy,p.sn,b.leave||'',b.family||'',b.backstory||'',...p.tags,...p.arch].join(' ').toLowerCase();
      const card=document.createElement('div');
      card.className='card';
      card.dataset.id=p.id;card.dataset.type=p.role;card.dataset.verdict=p.v;
      card.dataset.archs=p.arch.join(' ');card.dataset.s=srchTxt;
      card.innerHTML=`
        <div class="cstripe ${strC}"></div>
        <div class="cbody">
          <div class="cscen">Scenario ${String(p.sc).padStart(2,'0')}</div>
          <div class="cname">${p.name}</div>
          <div class="ctitle">${roleL} · ${p.pgy} · ${p.nat}</div>
          <div class="ctags">
            <span class="tag ${tagRC}">${roleL}</span>
            <span class="tag tv-${p.v}">${vL}</span>
            <span class="tag tpgy">${p.pgy}</span>
            ${aTags}
          </div>
          <div class="cdesc">
            ${p.desc}
            ${p.ev?`<div class="cevent ${evC}">${p.ev}</div>`:''}
            <div class="expand-hint">▼ click to expand</div>
          </div>
        </div>
        <div class="cpanel" id="panel-${p.id}">
          ${b.leave?`<div class="cps"><div class="cpl">Leave request</div><div class="cpt">${b.leave}</div></div>`:''}
          ${b.family?`<div class="cps"><div class="cpl">Family &amp; background</div><div class="cpt">${b.family}</div></div>`:''}
          ${b.backstory?`<div class="cps"><div class="cpl">The fuller story</div><div class="cpt">${b.backstory}</div></div>`:''}
        </div>
        <div class="sbadge" style="background:${bCol}">S${String(p.sc).padStart(2,'0')}</div>`;
      card.addEventListener('click',()=>{
        const panel=document.getElementById('panel-'+p.id);
        panel.classList.toggle('open');
        card.querySelector('.expand-hint').textContent=panel.classList.contains('open')?'▲ collapse':'▼ click to expand';
      });
      grid.appendChild(card);
    });
  });
}
function filter(){
  const q=document.getElementById('srch').value.toLowerCase();
  let vis=0;
  document.querySelectorAll('.card').forEach(c=>{
    const ms=!q||c.dataset.s.includes(q);
    const mt=typeF==='all'||c.dataset.type===typeF;
    const mv=!verdictF||c.dataset.verdict===verdictF;
    const ma=!archF||c.dataset.archs.includes(archF);
    const show=ms&&mt&&mv&&ma;
    c.classList.toggle('hidden',!show);
    if(show)vis++;
  });
  document.querySelectorAll('.sdiv').forEach(d=>{
    const g=d.nextElementSibling;
    if(g){const hv=[...g.querySelectorAll('.card')].some(c=>!c.classList.contains('hidden'));d.style.display=hv?'':'none';g.style.display=hv?'':'none';}
  });
  document.getElementById('cnt').textContent=vis+' '+(vis===1?'person':'people');
  document.getElementById('nores').classList.toggle('vis',vis===0);
}
function byType(t,btn){typeF=t;document.querySelectorAll('.fg:nth-child(2) .fb').forEach(b=>b.className='fb');btn.className='fb act';filter();}
function byVerdict(v,btn){const m={robust:'act-g',stressed:'act-a',breakdown:'act-r'};if(verdictF===v){verdictF=null;btn.className='fb';}else{verdictF=v;document.querySelectorAll('.fg:nth-child(3) .fb').forEach(b=>b.className='fb');btn.className='fb '+m[v];}filter();}
function byArch(a,btn){if(archF===a){archF=null;btn.className='fb';}else{archF=a;document.querySelectorAll('.fg:nth-child(4) .fb').forEach(b=>b.className='fb');btn.className='fb act-b';}filter();}
buildCards();filter();
</script>
